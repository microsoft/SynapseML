codecov:
  notify:
    require_ci_to_pass: no
    # CoverageComplete sends one notification after every selected job finishes.
    manual_trigger: true

comment:
  layout: "reach,diff,flags,files"
  behavior: new
  require_changes: false
  require_base: false
  require_head: true
  show_carryforward_flags: true

coverage:
  precision: 2
  round: down
  range: "50...100"
  status:
    project:
      default: off
      scala:
        paths:
          - "*/src/main/scala"
        target: auto
      python:
        paths:
          - "*/src/main/python"
        target: auto
    patch:
      default: off
    changes: no

flag_management:
  default_rules:
    # Flags identify a test family/package; shards sharing a flag are always
    # selected together. Full builds seed coverage for omitted, unaffected jobs.
    carryforward: true
