- job: ReleaseBranchCompat
  dependsOn: BuildAndCacheSbt
  displayName: 'Release Branch Compatibility Check'
  cancelTimeoutInMinutes: 0
  timeoutInMinutes: 60
  continueOnError: true
  condition: >-
    and(
      succeeded(),
      eq(variables.isPR, true),
      or(
        eq(variables['System.PullRequest.TargetBranch'], 'master'),
        eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/master')
      )
    )
  pool:
    vmImage: $(UBUNTU_VERSION)
  strategy:
    # master already targets Spark 3.5; normal PR validation covers that runtime.
    matrix:
      spark4.1:
        RELEASE_BRANCH: spark4.1
        JAVA_VERSION: 17
        SBT_JAVA_OPTS: "-J--add-opens=java.prefs/java.util.prefs=ALL-UNNAMED"
  steps:
    - checkout: self
      fetchDepth: 0

    - task: JavaToolInstaller@0
      displayName: 'Set up JDK $(JAVA_VERSION)'
      inputs:
        versionSpec: $(JAVA_VERSION)
        jdkArchitectureOption: x64
        jdkSourceOption: PreInstalled

    - bash: |
        set -euo pipefail
        install -m 755 tools/ci/sbt_retry.sh "$(Agent.TempDirectory)/sbt_retry.sh"
        test -x "$(Agent.TempDirectory)/sbt_retry.sh"
      displayName: 'Stage sbt retry helper for release checkout'

    - bash: |
        set -e
        echo "=== Current HEAD (PR merge commit) ==="
        git log --oneline -1
        PR_MERGE_HEAD=$(git rev-parse HEAD)
        TARGET_HEAD=$(git rev-parse HEAD^1)
        SOURCE_HEAD=$(git rev-parse HEAD^2)
        echo "PR merge: $PR_MERGE_HEAD"
        echo "PR target: $TARGET_HEAD"
        echo "PR source: $SOURCE_HEAD"

        RELEASE_RELEVANT_PATHS=()
        while IFS= read -r -d '' path; do
          case "$path" in
            .github/*|.pipelines/*|docs/*|templates/*|tools/acr/*|tools/ci/*|tools/docker/*|tools/helm/*|website/*)
              ;;
            pipeline.yaml|CODEOWNERS|CONTRIBUTING.md|LICENSE|README.md|SECURITY.md)
              ;;
            *)
              RELEASE_RELEVANT_PATHS+=("$path")
              ;;
          esac
        done < <(git diff --name-only -z "$TARGET_HEAD" HEAD)

        if [ ${#RELEASE_RELEVANT_PATHS[@]} -eq 0 ]; then
          echo "No release-relevant paths changed; compatibility validation is not required"
          echo "##vso[task.setvariable variable=releaseCompatRequired]false"
          exit 0
        fi

        echo "Release-relevant paths:"
        printf '  %s\n' "${RELEASE_RELEVANT_PATHS[@]}"

        echo "=== Fetching release branch $(RELEASE_BRANCH) ==="
        git fetch origin $(RELEASE_BRANCH)
        RELEASE_TIP=$(git rev-parse FETCH_HEAD)
        echo "Release branch tip: $RELEASE_TIP"

        REPLAY_PATHS=()
        for path in "${RELEASE_RELEVANT_PATHS[@]}"; do
          if ! git cat-file -e "$PR_MERGE_HEAD:$path" 2>/dev/null &&
             ! git cat-file -e "$RELEASE_TIP:$path" 2>/dev/null; then
            echo "Skipping deletion already absent on $(RELEASE_BRANCH): $path"
          else
            REPLAY_PATHS+=("$path")
          fi
        done

        if [ ${#REPLAY_PATHS[@]} -eq 0 ]; then
          echo "No release-relevant changes remain after excluding already-absent deletions"
          echo "##vso[task.setvariable variable=releaseCompatRequired]false"
          exit 0
        fi

        echo "Paths to replay:"
        printf '  %s\n' "${REPLAY_PATHS[@]}"
        echo "##vso[task.setvariable variable=releaseCompatRequired]true"

        PATCH_PATH="$(Agent.TempDirectory)/release-compat.patch"
        git diff --binary --full-index "$TARGET_HEAD" "$PR_MERGE_HEAD" -- \
          "${REPLAY_PATHS[@]}" > "$PATCH_PATH"
        test -s "$PATCH_PATH"

        echo "=== Attempting to apply release-relevant PR changes onto $(RELEASE_BRANCH) ==="
        git checkout --detach $RELEASE_TIP
        if ! APPLY_OUTPUT=$(git apply --3way --index "$PATCH_PATH" 2>&1); then
          printf '%s\n' "$APPLY_OUTPUT"
          CONFLICTING_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
          if [ -n "$CONFLICTING_FILES" ]; then
            echo "##vso[task.logissue type=warning]PR changes conflict with $(RELEASE_BRANCH)"
            echo ""
            echo "=== Conflicting files ==="
            printf '%s\n' "$CONFLICTING_FILES"
          else
            echo "##vso[task.logissue type=error]Unable to apply PR changes onto $(RELEASE_BRANCH) before conflict detection"
          fi
          exit 1
        fi
        printf '%s\n' "$APPLY_OUTPUT"
        echo "PR changes apply cleanly onto $(RELEASE_BRANCH)"
      displayName: 'Apply PR changes onto $(RELEASE_BRANCH)'

    - template: templates/sbt_cache.yml
      parameters:
        retryScriptPath: '$(Agent.TempDirectory)/sbt_retry.sh'
    - bash: |
        set -e
        export SBT_OPTS="-Xmx4G -Xss2M -Duser.timezone=GMT"

        echo "=== Compiling PR changes on $(RELEASE_BRANCH) ==="
        timeout 50m sbt $(SBT_JAVA_OPTS) \
          test:compile
        echo "$(RELEASE_BRANCH) compiles successfully"
      displayName: 'Validate $(RELEASE_BRANCH) after applying PR changes'
      timeoutInMinutes: 55
      condition: and(succeeded(), eq(variables.releaseCompatRequired, 'true'))

    - task: PublishTestResults@2
      displayName: 'Publish $(RELEASE_BRANCH) Test Results'
      inputs:
        testResultsFiles: '**/test-reports/TEST-*.xml'
        failTaskOnFailedTests: false
      condition: and(succeededOrFailed(), eq(variables.releaseCompatRequired, 'true'))
