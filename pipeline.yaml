- job: ReleaseBranchCompat
  dependsOn: BuildAndCacheSbt
  displayName: 'Release Branch Compatibility Check'
  cancelTimeoutInMinutes: 0
  timeoutInMinutes: 60
  continueOnError: true
  condition: >-
    and(
      succeeded(),
      eq(variables.isPR, true),
      or(
        eq(variables['System.PullRequest.TargetBranch'], 'master'),
        eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/master')
      )
    )
  pool:
    vmImage: $(UBUNTU_VERSION)
  strategy:
    # master already targets Spark 3.5; normal PR validation covers that runtime.
    matrix:
      spark4.1:
        RELEASE_BRANCH: spark4.1
        JAVA_VERSION: 17
        SBT_JAVA_OPTS: "-J--add-opens=java.prefs/java.util.prefs=ALL-UNNAMED"
  steps:
    - checkout: self
      fetchDepth: 0

    - task: JavaToolInstaller@0
      displayName: 'Set up JDK $(JAVA_VERSION)'
      inputs:
        versionSpec: $(JAVA_VERSION)
        jdkArchitectureOption: x64
        jdkSourceOption: PreInstalled

    - bash: |
        set -euo pipefail
        install -m 755 tools/ci/sbt_retry.sh "$(Agent.TempDirectory)/sbt_retry.sh"
        test -x "$(Agent.TempDirectory)/sbt_retry.sh"
      displayName: 'Stage sbt retry helper for release checkout'

    - bash: |
        set -e
        echo "=== Current HEAD (PR merge commit) ==="
        git log --oneline -1
        PR_MERGE_HEAD=$(git rev-parse HEAD)
        TARGET_HEAD=$(git rev-parse HEAD^1)
        SOURCE_HEAD=$(git rev-parse HEAD^2)
        echo "PR merge: $PR_MERGE_HEAD"
        echo "PR target: $TARGET_HEAD"
        echo "PR source: $SOURCE_HEAD"

        RELEASE_RELEVANT_PATHS=()
        while IFS= read -r -d '' path; do
          case "$path" in
            .github/*|.pipelines/*|docs/*|templates/*|tools/acr/*|tools/ci/*|tools/docker/*|tools/helm/*|website/*)
              ;;
            pipeline.yaml|CODEOWNERS|CONTRIBUTING.md|LICENSE|README.md|SECURITY.md)
              ;;
            *)
              RELEASE_RELEVANT_PATHS+=("$path")
              ;;
          esac
        done < <(git diff --name-only -z "$TARGET_HEAD" HEAD)

        if [ ${#RELEASE_RELEVANT_PATHS[@]} -eq 0 ]; then
          echo "No release-relevant paths changed; compatibility validation is not required"
          echo "##vso[task.setvariable variable=releaseCompatRequired]false"
          exit 0
        fi

        echo "Release-relevant paths:"
        printf '  %s\n' "${RELEASE_RELEVANT_PATHS[@]}"

        echo "=== Fetching release branch $(RELEASE_BRANCH) ==="
        git fetch origin $(RELEASE_BRANCH)
        RELEASE_TIP=$(git rev-parse FETCH_HEAD)
        echo "Release branch tip: $RELEASE_TIP"

        REPLAY_PATHS=()
        for path in "${RELEASE_RELEVANT_PATHS[@]}"; do
          if ! git cat-file -e "$PR_MERGE_HEAD:$path" 2>/dev/null &&
             ! git cat-file -e "$RELEASE_TIP:$path" 2>/dev/null; then
            echo "Skipping deletion already absent on $(RELEASE_BRANCH): $path"
          else
            REPLAY_PATHS+=("$path")
          fi
        done

        if [ ${#REPLAY_PATHS[@]} -eq 0 ]; then
          echo "No release-relevant changes remain after excluding already-absent deletions"
          echo "##vso[task.setvariable variable=releaseCompatRequired]false"
          exit 0
        fi

        echo "Paths to replay:"
        printf '  %s\n' "${REPLAY_PATHS[@]}"
        echo "##vso[task.setvariable variable=releaseCompatRequired]true"

        PATCH_PATH="$(Agent.TempDirectory)/release-compat.patch"
        git diff --binary --full-index "$TARGET_HEAD" "$PR_MERGE_HEAD" -- \
          "${REPLAY_PATHS[@]}" > "$PATCH_PATH"
        test -s "$PATCH_PATH"

        PREREQUISITES_CONFIG=".pipelines/release-compat-prerequisites.txt"
        CONFIGURED_PREREQUISITES=()
        CONFIGURED_PREREQUISITE_SCOPES=()
        CONFIGURED_PREREQUISITE_IS_SCOPED=()
        if git cat-file -e "$PR_MERGE_HEAD:$PREREQUISITES_CONFIG" 2>/dev/null; then
          LINE_NUMBER=0
          while IFS= read -r RAW_LINE || [ -n "$RAW_LINE" ]; do
            LINE_NUMBER=$((LINE_NUMBER + 1))
            LINE_WITHOUT_CR="${RAW_LINE%$'\r'}"
            SCOPED_LINE="${LINE_WITHOUT_CR#"${LINE_WITHOUT_CR%%[![:space:]]*}"}"
            TRIMMED_LINE="${SCOPED_LINE%"${SCOPED_LINE##*[![:space:]]}"}"
            case "$TRIMMED_LINE" in
              ""|\#*)
                continue
                ;;
            esac
            if [[ "$SCOPED_LINE" == *$'\t'* ]]; then
              PREREQUISITE="${SCOPED_LINE%%$'\t'*}"
              PREREQUISITE_SCOPE="${SCOPED_LINE#*$'\t'}"
              PREREQUISITE_IS_SCOPED=true
            else
              PREREQUISITE="$TRIMMED_LINE"
              PREREQUISITE_SCOPE=""
              PREREQUISITE_IS_SCOPED=false
            fi
            if [[ ! "$PREREQUISITE" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "##vso[task.logissue type=error]Invalid prerequisite at $PREREQUISITES_CONFIG:$LINE_NUMBER; expected a full 40-character commit SHA optionally followed by tab-separated paths"
              exit 1
            fi
            if [ "$PREREQUISITE_IS_SCOPED" = true ]; then
              REMAINING_PATHS="$PREREQUISITE_SCOPE"
              while true; do
                if [[ "$REMAINING_PATHS" == *$'\t'* ]]; then
                  path="${REMAINING_PATHS%%$'\t'*}"
                  REMAINING_PATHS="${REMAINING_PATHS#*$'\t'}"
                  HAS_MORE_PATHS=true
                else
                  path="$REMAINING_PATHS"
                  HAS_MORE_PATHS=false
                fi
                if [ -z "$path" ]; then
                  echo "##vso[task.logissue type=error]Scoped prerequisite $PREREQUISITE contains an empty path"
                  exit 1
                fi
                TRIMMED_PATH="${path#"${path%%[![:space:]]*}"}"
                TRIMMED_PATH="${TRIMMED_PATH%"${TRIMMED_PATH##*[![:space:]]}"}"
                if [ "$path" != "$TRIMMED_PATH" ]; then
                  echo "##vso[task.logissue type=error]Scoped prerequisite path must not have leading or trailing whitespace: $path"
                  exit 1
                fi
                case "$path" in
                  /*|.|./*)
                    echo "##vso[task.logissue type=error]Scoped prerequisite path must be repo-relative: $path"
                    exit 1
                    ;;
                esac
                case "/$path/" in
                  */../*)
                    echo "##vso[task.logissue type=error]Scoped prerequisite path must not contain traversal: $path"
                    exit 1
                    ;;
                  *//*|*/./*)
                    echo "##vso[task.logissue type=error]Scoped prerequisite path must be normalized: $path"
                    exit 1
                    ;;
                esac
                if [ "$HAS_MORE_PATHS" = false ]; then
                  break
                fi
              done
            else
              if ! git cat-file -e "$PREREQUISITE^{commit}" 2>/dev/null; then
                echo "##vso[task.logissue type=error]Release compatibility prerequisite $PREREQUISITE is unavailable"
                exit 1
              fi
              if ! git merge-base --is-ancestor "$PREREQUISITE" "$TARGET_HEAD"; then
                echo "##vso[task.logissue type=error]Release compatibility prerequisite $PREREQUISITE is not an ancestor of PR target $TARGET_HEAD"
                exit 1
              fi
            fi
            CONFIGURED_PREREQUISITES+=("$PREREQUISITE")
            CONFIGURED_PREREQUISITE_SCOPES+=("$PREREQUISITE_SCOPE")
            CONFIGURED_PREREQUISITE_IS_SCOPED+=("$PREREQUISITE_IS_SCOPED")
          done < <(git show "$PR_MERGE_HEAD:$PREREQUISITES_CONFIG")
        fi

        PREREQUISITE_COMMITS=()
        PREREQUISITE_PATCHES=()
        for index in "${!CONFIGURED_PREREQUISITES[@]}"; do
          PREREQUISITE="${CONFIGURED_PREREQUISITES[$index]}"
          PREREQUISITE_SCOPE="${CONFIGURED_PREREQUISITE_SCOPES[$index]}"
          PREREQUISITE_IS_SCOPED="${CONFIGURED_PREREQUISITE_IS_SCOPED[$index]}"
          PREREQUISITE_PATHS=()
          PREREQUISITE_PATHSPECS=()
          if [ "$PREREQUISITE_IS_SCOPED" = true ]; then
            REMAINING_PATHS="$PREREQUISITE_SCOPE"
            while true; do
              if [[ "$REMAINING_PATHS" == *$'\t'* ]]; then
                path="${REMAINING_PATHS%%$'\t'*}"
                REMAINING_PATHS="${REMAINING_PATHS#*$'\t'}"
                HAS_MORE_PATHS=true
              else
                path="$REMAINING_PATHS"
                HAS_MORE_PATHS=false
              fi
              PATH_SELECTED=false
              for REPLAY_PATH in "${REPLAY_PATHS[@]}"; do
                if [ "$path" = "$REPLAY_PATH" ]; then
                  PREREQUISITE_PATHS+=("$path")
                  PATH_SELECTED=true
                  break
                fi
              done
              if [ "$PATH_SELECTED" = false ]; then
                for ((later_index=index + 1;
                      later_index<${#CONFIGURED_PREREQUISITES[@]};
                      later_index++)); do
                  if [ "${CONFIGURED_PREREQUISITE_IS_SCOPED[$later_index]}" = false ]; then
                    LATER_PREREQUISITE="${CONFIGURED_PREREQUISITES[$later_index]}"
                        if ! LATER_PARENT=$(git rev-parse "$LATER_PREREQUISITE^1" 2>/dev/null); then
                          echo "##vso[task.logissue type=error]Dependent release compatibility prerequisite $LATER_PREREQUISITE has no first parent"
                          exit 1
                        fi
                    if git diff --quiet "$LATER_PARENT" "$LATER_PREREQUISITE" -- \
                      ":(literal)$path"; then
                      :
                    else
                      DIFF_STATUS=$?
                      if [ "$DIFF_STATUS" -ne 1 ]; then
                        echo "##vso[task.logissue type=error]Unable to inspect dependent prerequisite $LATER_PREREQUISITE for path: $path"
                        exit 1
                      fi
                      echo "Scoped prerequisite $PREREQUISITE path $path is required by later prerequisite $LATER_PREREQUISITE"
                      PREREQUISITE_PATHS+=("$path")
                      PATH_SELECTED=true
                      break
                    fi
                  fi
                done
              fi
              if [ "$HAS_MORE_PATHS" = false ]; then
                break
              fi
            done
            if [ ${#PREREQUISITE_PATHS[@]} -eq 0 ]; then
              echo "Scoped prerequisite $PREREQUISITE has no paths in this PR replay; skipping"
              continue
            fi
            if ! git cat-file -e "$PREREQUISITE^{commit}" 2>/dev/null; then
              echo "##vso[task.logissue type=error]Release compatibility prerequisite $PREREQUISITE is unavailable"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$PREREQUISITE" "$TARGET_HEAD"; then
              echo "##vso[task.logissue type=error]Release compatibility prerequisite $PREREQUISITE is not an ancestor of PR target $TARGET_HEAD"
              exit 1
            fi
          fi
          if ! PREREQUISITE_PARENT=$(git rev-parse "$PREREQUISITE^1" 2>/dev/null); then
            echo "##vso[task.logissue type=error]Release compatibility prerequisite $PREREQUISITE has no first parent"
            exit 1
          fi
          if [ "$PREREQUISITE_IS_SCOPED" = true ]; then
            for path in "${PREREQUISITE_PATHS[@]}"; do
              if git diff --quiet "$PREREQUISITE_PARENT" "$PREREQUISITE" -- \
                ":(literal)$path"; then
                echo "##vso[task.logissue type=error]Scoped path is not changed by prerequisite $PREREQUISITE: $path"
                exit 1
              else
                DIFF_STATUS=$?
                if [ "$DIFF_STATUS" -ne 1 ]; then
                  echo "##vso[task.logissue type=error]Unable to validate scoped path for prerequisite $PREREQUISITE: $path"
                  exit 1
                fi
              fi
              if git cat-file -e "$PREREQUISITE_PARENT:$path" 2>/dev/null; then
                echo "##vso[task.logissue type=error]Scoped path is not an add-only baseline in prerequisite $PREREQUISITE: $path"
                exit 1
              fi
              if ! PREREQUISITE_BLOB=$(git rev-parse "$PREREQUISITE:$path" 2>/dev/null); then
                echo "##vso[task.logissue type=error]Scoped path is absent from prerequisite $PREREQUISITE: $path"
                exit 1
              fi
              if [ "$(git cat-file -t "$PREREQUISITE_BLOB")" != blob ]; then
                echo "##vso[task.logissue type=error]Scoped prerequisite path is not a blob: $path"
                exit 1
              fi
              BASELINE_COMMIT="$TARGET_HEAD"
              for ((later_index=index + 1;
                    later_index<${#CONFIGURED_PREREQUISITES[@]};
                    later_index++)); do
                if [ "${CONFIGURED_PREREQUISITE_IS_SCOPED[$later_index]}" = false ]; then
                  LATER_PREREQUISITE="${CONFIGURED_PREREQUISITES[$later_index]}"
                  if ! LATER_PARENT=$(git rev-parse "$LATER_PREREQUISITE^1" 2>/dev/null); then
                    echo "##vso[task.logissue type=error]Dependent release compatibility prerequisite $LATER_PREREQUISITE has no first parent"
                    exit 1
                  fi
                  if git diff --quiet "$LATER_PARENT" "$LATER_PREREQUISITE" -- \
                    ":(literal)$path"; then
                    :
                  else
                    DIFF_STATUS=$?
                    if [ "$DIFF_STATUS" -ne 1 ]; then
                      echo "##vso[task.logissue type=error]Unable to inspect dependent prerequisite $LATER_PREREQUISITE for path: $path"
                      exit 1
                    fi
                    BASELINE_COMMIT="$LATER_PARENT"
                    break
                  fi
                fi
              done
              if ! BASELINE_BLOB=$(git rev-parse "$BASELINE_COMMIT:$path" 2>/dev/null); then
                echo "##vso[task.logissue type=error]Scoped path is absent from expected baseline $BASELINE_COMMIT: $path"
                exit 1
              fi
              if [ "$PREREQUISITE_BLOB" != "$BASELINE_BLOB" ]; then
                echo "##vso[task.logissue type=error]Scoped prerequisite blob does not match expected baseline $BASELINE_COMMIT: $path"
                exit 1
              fi
              PREREQUISITE_PATHSPECS+=(":(literal)$path")
            done
          else
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/*|.pipelines/*|docs/*|templates/*|tools/acr/*|tools/ci/*|tools/docker/*|tools/helm/*|website/*)
                  ;;
                pipeline.yaml|CODEOWNERS|CONTRIBUTING.md|LICENSE|README.md|SECURITY.md)
                  ;;
                *)
                  PREREQUISITE_PATHS+=("$path")
                  PREREQUISITE_PATHSPECS+=(":(literal)$path")
                  ;;
              esac
            done < <(git diff --no-renames --name-only -z "$PREREQUISITE_PARENT" "$PREREQUISITE")
          fi

          if [ ${#PREREQUISITE_PATHS[@]} -eq 0 ]; then
            echo "Prerequisite $PREREQUISITE has no release-relevant paths; skipping"
            continue
          fi

          PREREQUISITE_PATCH="$(Agent.TempDirectory)/release-compat-prerequisite-$PREREQUISITE.patch"
          git diff --binary --full-index "$PREREQUISITE_PARENT" "$PREREQUISITE" -- \
            "${PREREQUISITE_PATHSPECS[@]}" > "$PREREQUISITE_PATCH"
          if [ ! -s "$PREREQUISITE_PATCH" ]; then
            echo "##vso[task.logissue type=error]Prerequisite $PREREQUISITE produced an empty release patch"
            exit 1
          fi
          PREREQUISITE_COMMITS+=("$PREREQUISITE")
          PREREQUISITE_PATCHES+=("$PREREQUISITE_PATCH")
        done

        echo "=== Attempting to apply release-relevant PR changes onto $(RELEASE_BRANCH) ==="
        git checkout --detach $RELEASE_TIP
        git reset --hard $RELEASE_TIP
        git update-index --refresh
        for index in "${!PREREQUISITE_COMMITS[@]}"; do
          PREREQUISITE="${PREREQUISITE_COMMITS[$index]}"
          PREREQUISITE_PATCH="${PREREQUISITE_PATCHES[$index]}"
          echo "=== Applying release compatibility prerequisite $PREREQUISITE ==="
          if git apply --reverse --check --index "$PREREQUISITE_PATCH" >/dev/null 2>&1; then
            echo "Prerequisite $PREREQUISITE is already present on $(RELEASE_BRANCH); skipping"
            continue
          fi
          if ! APPLY_OUTPUT=$(git apply --3way --index "$PREREQUISITE_PATCH" 2>&1); then
            printf '%s\n' "$APPLY_OUTPUT"
            CONFLICTING_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
            if [ -n "$CONFLICTING_FILES" ]; then
              echo "##vso[task.logissue type=error]Prerequisite $PREREQUISITE conflicts with $(RELEASE_BRANCH)"
              echo ""
              echo "=== Conflicting files ==="
              printf '%s\n' "$CONFLICTING_FILES"
            else
              echo "##vso[task.logissue type=error]Unable to apply prerequisite $PREREQUISITE before conflict detection"
            fi
            echo "=== Checkout status after prerequisite failure ==="
            git status --short
            exit 1
          fi
          printf '%s\n' "$APPLY_OUTPUT"
          echo "Prerequisite $PREREQUISITE applies cleanly"
        done

        if ! APPLY_OUTPUT=$(git apply --3way --index "$PATCH_PATH" 2>&1); then
          printf '%s\n' "$APPLY_OUTPUT"
          CONFLICTING_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
          if [ -n "$CONFLICTING_FILES" ]; then
            echo "##vso[task.logissue type=warning]PR changes conflict with $(RELEASE_BRANCH)"
            echo ""
            echo "=== Conflicting files ==="
            printf '%s\n' "$CONFLICTING_FILES"
          else
            echo "##vso[task.logissue type=error]Unable to apply PR changes onto $(RELEASE_BRANCH) before conflict detection"
          fi
          exit 1
        fi
        printf '%s\n' "$APPLY_OUTPUT"
        echo "PR changes apply cleanly onto $(RELEASE_BRANCH)"
      displayName: 'Apply PR changes onto $(RELEASE_BRANCH)'

    - template: templates/sbt_cache.yml
      parameters:
        retryScriptPath: '$(Agent.TempDirectory)/sbt_retry.sh'
    - bash: |
        set -e
        export SBT_OPTS="-Xmx4G -Xss2M -Duser.timezone=GMT"

        echo "=== Compiling PR changes on $(RELEASE_BRANCH) ==="
        timeout 50m sbt $(SBT_JAVA_OPTS) \
          test:compile
        echo "$(RELEASE_BRANCH) compiles successfully"
      displayName: 'Validate $(RELEASE_BRANCH) after applying PR changes'
      timeoutInMinutes: 55
      condition: and(succeeded(), eq(variables.releaseCompatRequired, 'true'))

    - task: PublishTestResults@2
      displayName: 'Publish $(RELEASE_BRANCH) Test Results'
      inputs:
        testResultsFiles: '**/test-reports/TEST-*.xml'
        failTaskOnFailedTests: false
      condition: and(succeededOrFailed(), eq(variables.releaseCompatRequired, 'true'))
- job: InternalCompat
  displayName: 'SynapseML-Internal Compatibility Check'
  # Scoped to PR builds, matching ReleaseBranchCompat above: this validates that a
  # proposed change still compiles Internal, which is only actionable while the
  # change can still be revised. System.PullRequest.* is empty on non-PR builds, so
  # the IsFork check alone would let this 120-minute, secret-consuming job run on
  # every master push and nightly build.
  # SynapseML-Internal is a private repo. Fork PRs cannot authenticate to it, so skip the job
  # there rather than failing every external contribution.
  condition: >-
    and(
      succeeded(),
      eq(variables.isPR, true),
      ne(variables['System.PullRequest.IsFork'], 'True')
    )
  cancelTimeoutInMinutes: 0
  # Advisory, not a merge gate. The Internal repo moves independently of this one, so a red
  # here is as often "Internal's own snapshot did not resolve today" as it is a real break --
  # build 230974877 went red with `unresolved dependency: ...-internal_2.12 ... not found` on a
  # PR that changes only pipeline.yaml. Without this, InternalCompat rolls up into the required
  # `microsoft.SynapseML` check and a transient Internal problem blocks unrelated OSS merges.
  # This still surfaces as its own red check run, so the signal is not lost, matching how
  # ReleaseBranchCompat above is configured.
  continueOnError: true
  # Per lane, not for the whole job. The longest lane is Scala at ~39 min measured
  # (build 231549771), so 120 is generous; it is kept rather than tightened because
  # spark.aifunc calls live AI services and its 22.8 min is service-latency bound.
  timeoutInMinutes: 120
  dependsOn: BuildAndCacheSbt
  pool:
    vmImage: $(UBUNTU_VERSION)
  # Scala and Python validation are independent -- neither reads the other's output --
  # but the job ran them back to back purely because they shared one checkout. Measured
  # on build 231549771 (67.6 min total): the shared prefix (checkout, publish OSS to
  # local Maven, retarget, compile) is ~12.5 min, Scala tests are 25.9 min, and the
  # Python package+test pair is 20.2 min. Running the halves as matrix legs makes the
  # wall clock max(~39, ~41) instead of the sum, so PR feedback arrives ~27 min sooner.
  #
  # Two legs, not more. Every leg re-pays the ~12.5 min prefix, so a third leg -- moving
  # spark.aifunc, which is 22.8 of the Scala 25.9 min, away from ebm+predict -- would
  # only take the wall clock from ~41 to ~38 min while adding a whole agent.
  # SynapseML-Internal's own pipeline shards far further (6 Scala jobs, 8 Python jobs),
  # but its legs have no comparable prefix to amortise: they resolve a published OSS
  # artifact rather than building one from the PR under test.
  strategy:
    matrix:
      scala:
        COMPAT_LANE: scala
      python:
        COMPAT_LANE: python
  # sbt on Java 17 needs java.util.prefs opened reflectively. Setting it here
  # rather than on individual sbt commands covers every JVM the job starts,
  # including templates/sbt_cache.yml's prewarm, the Internal test loop, and any
  # JVM the tests fork -- per-command flags reach none of those. spark4.0's
  # pipeline already uses JAVA_TOOL_OPTIONS this way for the same reason.
  #
  # Set unconditionally rather than only for Spark 4. `java.prefs` has existed
  # since Java 9, so on master's Java 11 the option is genuinely applied rather
  # than ignored -- it just opens a package nothing on that path reflects into,
  # which is harmless. Setting it for every target keeps a branch conditional
  # out of this file.
  #
  # The one place JVM stderr is parsed is the OSS version read below, and its
  # grep is anchored to '^\[info\] ', which the "Picked up JAVA_TOOL_OPTIONS"
  # line cannot match.
  variables:
    JAVA_TOOL_OPTIONS: '--add-opens=java.prefs/java.util.prefs=ALL-UNNAMED'
  steps:
    # Explicit paths: a multi-repo job otherwise nests every repo under a folder
    # named after it, which moves the OSS root off $(Build.SourcesDirectory). That
    # would leave templates/sbt_cache.yml resolving its cache keys and
    # tools/ci/sbt_retry.sh against a directory with no build definition, so this
    # job would silently cold-bootstrap sbt instead of sharing the prewarmed cache.
    - checkout: self
      path: s
    - checkout: SynapseML-Internal
      path: s-internal
      # Required by 'Select matching SynapseML-Internal branch' below: without persisted
      # credentials the follow-up fetch cannot authenticate to this private repo.
      persistCredentials: true
    # The JDK has to match the branch under test, and the branch already declares it:
    # templates/java_setup.yml is this repo's per-branch JDK pin, carrying 11 here and
    # 17 on spark4.0/spark4.1. Without it this job compiled both trees on the agent's
    # default JDK and failed with "Class java.lang.Record not found" -- on the OSS tree
    # for spark4.1 (build 231477746) and on the Internal tree for spark4.0 (build
    # 231456784), a type that arrived in Java 16. That was a permanent red on those
    # branches rather than a real compatibility signal.
    #
    # Including the template rather than mapping the target branch to a version here
    # keeps this line identical on every branch, so the sync never has to reconcile it,
    # and leaves exactly one place per branch that decides the JDK.
    - template: templates/java_setup.yml
    # Internal mirrors this repo's branch names 1:1 (master, spark3.5, spark4.0, spark4.1),
    # so the OSS branch under test decides which Internal branch is the correct comparison
    # point: master pairs with Internal master (both Spark 3.5), spark4.1 with Internal
    # spark4.1. Validating a Spark 4.1 PR against Internal master would compile a Spark 3.5
    # tree against Spark 4.1 artifacts, which cannot resolve -- a permanent red on that
    # branch rather than a real signal.
    - bash: |
        set -euo pipefail
        cd $(Agent.BuildDirectory)/s-internal

        # Read the target branch from the environment rather than a $() macro: macros are
        # substituted as raw text into the script, and git permits ';' and quotes in ref
        # names, so a crafted branch name would otherwise be executable.
        OSS_TARGET="${SYSTEM_PULLREQUEST_TARGETBRANCH:-}"
        OSS_TARGET="${OSS_TARGET#refs/heads/}"
        if [ -z "$OSS_TARGET" ]; then
          echo "##vso[task.logissue type=error]System.PullRequest.TargetBranch is empty; this job is PR-only"
          exit 1
        fi

        # Identity mapping: OSS and Internal use the same branch names, so a branch added to
        # the pr: trigger list is paired correctly without touching this step.
        INTERNAL_BRANCH="$OSS_TARGET"

        # Fall back rather than fail: this job is advisory, and Internal may not have cut a
        # counterpart branch yet. The warning keeps the mismatch visible, because a silent
        # fallback would report a result that actually validated a different Spark line.
        if ! git ls-remote --exit-code --heads origin "$INTERNAL_BRANCH" >/dev/null 2>&1; then
          echo "##vso[task.logissue type=warning]SynapseML-Internal has no '$INTERNAL_BRANCH' branch; falling back to master. This PR targets OSS '$OSS_TARGET', so treat any failure here as unverified."
          INTERNAL_BRANCH=master
        fi

        echo "OSS target branch '$OSS_TARGET' -> SynapseML-Internal '$INTERNAL_BRANCH'"
        git fetch --no-tags origin "$INTERNAL_BRANCH"
        git checkout --force FETCH_HEAD
        echo "##vso[task.setvariable variable=INTERNAL_BRANCH]$INTERNAL_BRANCH"
        echo "=== SynapseML-Internal now at $INTERNAL_BRANCH ==="
        git log --oneline -1
      displayName: 'Select matching SynapseML-Internal branch'
    - template: templates/sbt_cache.yml
    - task: AzureCLI@2
      displayName: 'Publish OSS to local Maven'
      timeoutInMinutes: 20
      inputs:
        azureSubscription: 'SynapseML Build'
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          set -e
          cd $(Build.SourcesDirectory)
          export SBT_OPTS="-Xmx4G -Xss2M -Duser.timezone=GMT"
          # The version string is recomputed on every sbt invocation and embeds an HHmm
          # timestamp whenever the tree is dirty, so querying the version and publishing in
          # two separate invocations can yield two different versions when they straddle a
          # minute boundary. Run both in ONE sbt session so the version is computed once.
          if ! SBT_OUT="$(sbt -no-colors "core/version" publishM2 2>&1)"; then
            echo "$SBT_OUT"
            echo "##vso[task.logissue type=error]sbt core/version publishM2 failed"
            exit 1
          fi
          echo "$SBT_OUT"
          # tools/ci/get_sbt_version.sh is not reused here: it runs its own sbt
          # invocation, which is precisely the second invocation this step exists to
          # avoid. Its parsing and validation are mirrored inline instead. The regex
          # is anchored to the start of the line and requires a version-shaped token,
          # so a stray "[info] <digit>..." line elsewhere in the output cannot be
          # mistaken for the version and silently retarget Internal at an artifact
          # that was never published.
          OSS_VERSION=$(echo "$SBT_OUT" | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -m1 -E '^\[info\] ([0-9]+\.[0-9]+|HEAD-)' | cut -d' ' -f2)
          echo "OSS version: $OSS_VERSION"
          # The grep above already constrains the shape, so an empty result is the only
          # way this can go wrong: it means no line matched.
          if [ -z "$OSS_VERSION" ]; then
            echo "##vso[task.logissue type=error]Failed to determine the OSS version from sbt output"
            exit 1
          fi
          # Every later step interpolates this value into bash, sed and grep. The grep
          # above only anchors the start of the token, so constrain the whole thing to
          # characters that are inert in all three contexts: that removes any way for a
          # crafted version string in build.sbt to smuggle a command substitution or a
          # sed delimiter through the Azure Pipelines macro expander.
          case "$OSS_VERSION" in
            *[!A-Za-z0-9._+-]*)
              echo "##vso[task.logissue type=error]OSS version '$OSS_VERSION' contains unexpected characters"
              exit 1
              ;;
          esac
          echo "##vso[task.setvariable variable=OSS_VERSION]$OSS_VERSION"
          echo "=== published OSS versions in ~/.m2 ==="
          ls "$HOME/.m2/repository/com/microsoft/azure/" 2>/dev/null || true
    - bash: |
        set -e
        cd $(Agent.BuildDirectory)/s-internal

        # $OSS_VERSION is read as a bash environment variable rather than the
        # $(OSS_VERSION) macro: macros are pasted in as raw text before bash parses the
        # script, so a version string containing $() or backticks would execute.
        echo "=== Retargeting Internal to OSS version $OSS_VERSION ==="
        [ -n "${OSS_VERSION:-}" ] || { echo "##vso[task.logissue type=error]OSS_VERSION is not set"; exit 1; }
        grep -q '^val synapseMLVersion = ' build.sbt || {
          echo "##vso[task.logissue type=error]synapseMLVersion not found in Internal build.sbt"; exit 1; }
        grep -q '^resolvers ++= Seq(' build.sbt || {
          echo "##vso[task.logissue type=error]resolvers block not found in Internal build.sbt"; exit 1; }

        sed -i "s|val synapseMLVersion = \".*\"|val synapseMLVersion = \"${OSS_VERSION}\"|" build.sbt
        # Insert only when the resolvers block does not already carry it. 'sed a\'
        # appends unconditionally, so running this step twice against the same tree
        # adds a second Resolver.mavenLocal line each time. A hosted agent starts from
        # a fresh VM and the step above re-checks out Internal, so that cannot happen
        # today - but it also made the "tree is already clean" branch below unreachable,
        # because the append dirtied the tree even when both edits were already applied.
        #
        # Scope the test to the resolvers block rather than the whole file: Internal
        # carries an unrelated 'Resolver.mavenLocal' in usage/build.sbt and in
        # project/BlobMavenPlugin.scala, and a file-wide test that ever matched one of
        # those would skip the insert and leave Internal resolving against the
        # *published* OSS build - a false green, which is the one outcome this job
        # must never produce.
        if ! sed -n '/^resolvers ++= Seq(/,/^)/p' build.sbt | grep -qF 'Resolver.mavenLocal'; then
          sed -i '/^resolvers ++= Seq(/a\  Resolver.mavenLocal,' build.sbt
        fi

        # A silent no-op here would compile Internal against the *published* OSS build and
        # report a false green, so verify both edits actually landed. Use fixed-string
        # matching: the version contains dots, which as a regex would match any character
        # and could accept a line the sed above never wrote.
        grep -qF "val synapseMLVersion = \"${OSS_VERSION}\"" build.sbt || {
          echo "##vso[task.logissue type=error]Failed to retarget synapseMLVersion"; exit 1; }
        # Verify with the same block-scoped predicate the insert decides on, so the two
        # can never disagree: a file-wide check here would be satisfied by the
        # Resolver.mavenLocal in usage/build.sbt's sibling text and report success for a
        # resolvers block that never got one.
        sed -n '/^resolvers ++= Seq(/,/^)/p' build.sbt | grep -qF 'Resolver.mavenLocal' || {
          echo "##vso[task.logissue type=error]Failed to add Resolver.mavenLocal to the resolvers block"; exit 1; }

        if [ "$COMPAT_LANE" = "python" ]; then
          # The OSS checkout already emits PEP 561 package data. Internal's compatibility
          # helper still recognizes only the former one-line setup.py declaration,
          # so teach the disposable checkout the current exact representation
          # instead of rewriting OSS package metadata or disabling its typing gate.
          oss_codegen="$(Agent.BuildDirectory)/s/core/src/main/scala/com/microsoft/azure/synapse/ml/codegen/PyCodegen.scala"
          grep -qF '"": ["*.pyi", "py.typed"]' "$oss_codegen" || {
            echo "##vso[task.logissue type=error]OSS PyCodegen no longer declares the expected PEP 561 package data"; exit 1; }
          python "$(Agent.BuildDirectory)/s/tools/ci/patch_internal_typing_support.py" \
            utils/typing_build_support.py
        fi

        echo "=== Modified build.sbt ==="
        grep -n 'synapseMLVersion' build.sbt
        grep -n -A4 'resolvers ++=' build.sbt

        # Commit the retarget so the working tree is clean again.
        #
        # Internal's version comes from sbt-dynver, which appends a live
        # "-<yyyyMMdd>-<HHmm>" suffix whenever the tree is dirty and recomputes it
        # from the wall clock on every sbt load. The two sed edits above are what
        # make it dirty, so without this commit each sbt session in this job picks
        # a different version. Observed on build 231488245:
        #
        #   11:32  'sbt packagePython publishM2' bakes ...-1132-SNAPSHOT into the
        #          generated Python package and publishes that same jar to ~/.m2
        #   11:36  'sbt testPythonExcludeAIFunc' re-runs CodeGen in a new session,
        #          rebakes the package as ...-1136-SNAPSHOT and pip-installs it
        #   11:37  pytest fixtures read the baked coordinate out of the installed
        #          package and ask Ivy for ...-1136-SNAPSHOT, which nobody published
        #
        # Ivy fails the resolve, spark-submit dies before reporting a port, and
        # pyspark surfaces only JAVA_GATEWAY_EXITED - so every test in the step
        # errors at fixture setup with no indication of the real cause. Note that
        # make_mlflow_models.py runs in between and *succeeds*: it resolves the
        # 1132 jar correctly, because the rebake has not happened yet.
        #
        # Pinning only the packaging step could not fix this, because the version is
        # recomputed by a later sbt session. Making the tree clean is what makes
        # every session agree. The OSS side already demonstrates the end state: its
        # checkout is never edited, so its version carries no timestamp at all
        # (1.1.3-python3.13-102-bfba9c82-SNAPSHOT in that same build).
        #
        # Committing is enough on its own: 'git describe --dirty', which is what
        # dynver reads, only considers modifications to tracked files, and sbt's
        # build output lands in target/ which .gitignore already excludes. The
        # commit is local to the agent's checkout and is never pushed.
        #
        # Refresh git's stat cache before asking whether the tree changed. 'sed -i'
        # rewrites build.sbt in place, so its mtime and inode change even when the
        # bytes it writes are identical, and 'git diff-index' trusts stat info before
        # comparing content - it reports a phantom modification until the index is
        # refreshed. Without this, an already-retargeted tree takes the commit branch
        # below, 'git commit' finds nothing staged and exits 1, and 'set -e' fails the
        # step: exactly the non-idempotent retry the branch exists to prevent. Measured
        # by running this step three times against a simulated Internal checkout - runs
        # 2 and 3 exited 1 before this line was added and exit 0 after.
        #
        # '|| true' because --refresh deliberately exits non-zero when a file really
        # has changed, which is the normal case on the first run.
        git update-index -q --refresh || true

        # Commit only when the edits actually changed something. 'git commit' exits
        # non-zero when nothing is staged, which under 'set -e' would fail this step -
        # so an unconditional commit would turn "already retargeted" into a hard error
        # and make the step non-idempotent on retry. The greps above already proved
        # build.sbt holds the right values, so an unchanged tree is a valid state: it
        # just means the edits were already in place, and dynver emits a stable
        # version either way, which is all the rest of the job needs.
        if git diff-index --quiet HEAD --; then
          echo "Retarget produced no changes; tree is already clean"
        else
          git -c user.email=synapseml-ci@microsoft.com -c user.name='SynapseML CI' \
            commit --quiet --no-verify -am "CI: retarget to OSS ${OSS_VERSION}"
        fi

        # A dirty tree here would silently reintroduce the drift, so fail loudly
        # rather than hand the next steps a version that changes under them.
        #
        # Test git's exit status, not whether its output is empty. 'diff-index
        # --name-only' prints nothing and exits 128 when git itself fails (unborn
        # HEAD, unreadable index), which is indistinguishable from a clean tree if
        # you only look at stdout - so an emptiness test would wave through exactly
        # the broken state this guard exists to catch. '--quiet' exits non-zero for
        # both "dirty" and "git failed", and neither is safe to continue from.
        # An 'if' condition is exempt from 'set -e', and the diagnostic below is
        # guarded so a failing git cannot abort the step before the explicit exit.
        if ! git diff-index --quiet HEAD --; then
          echo "##vso[task.logissue type=error]Internal tree still dirty after commit (or git could not read it); dynver will append a wall-clock timestamp and the published and requested versions will diverge"
          git diff-index --name-only HEAD -- || true
          exit 1
        fi
        echo "=== Internal version is now stable for the rest of the job ==="
        git log --oneline -1
      displayName: 'Retarget Internal to this build'
    - task: AzureCLI@2
      displayName: 'Compile Internal against OSS'
      timeoutInMinutes: 15
      inputs:
        azureSubscription: 'SynapseML Build'
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          set -e
          cd $(Agent.BuildDirectory)/s-internal
          export SBT_OPTS="-Xmx4G -Xss2M -Duser.timezone=GMT"
          echo "Compiling SynapseML-Internal against OSS $OSS_VERSION..."
          sbt compile Test/compile
    - bash: |
        echo "##vso[task.prependpath]$CONDA/bin"
      displayName: 'Add conda to PATH'
    - bash: |
        sudo chown -R $(whoami):$(id -ng) $(CONDA_CACHE_DIR)
      displayName: 'Fix conda directory permissions'
      condition: and(succeeded(), eq(variables['COMPAT_LANE'], 'python'))
    - task: PipAuthenticate@1
      displayName: 'Private Conda Feed Authentication'
      inputs:
        artifactFeeds: 'A365/Synapse-Conda'
      condition: and(succeeded(), eq(variables['COMPAT_LANE'], 'python'))
    - bash: |
        conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
        conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r
      displayName: 'Accept Anaconda TOS'
      condition: and(succeeded(), eq(variables['COMPAT_LANE'], 'python'))
    - bash: |
        echo "=== Disk space BEFORE cleanup ==="
        df -h / | grep -E 'Filesystem|/$'
        echo "Removing unused pre-installed SDKs and runtimes..."
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/share/boost || true
        docker system prune -af --volumes 2>/dev/null || true
        echo "=== Disk space AFTER cleanup ==="
        df -h / | grep -E 'Filesystem|/$'
      displayName: 'Free disk space (remove unused SDKs)'
    - bash: |
        set -e
        conda env create --yes -f $(Agent.BuildDirectory)/s-internal/environment.yaml -v || \
          conda env create --yes -f $(Agent.BuildDirectory)/s-internal/environment.yaml -v
        conda clean --all -y
        pip cache purge
      displayName: 'Create Internal conda env'
      # Python lane only. Building this env costs 7.1 min (build 231549771) and only the
      # Python steps need it: SynapseML-Internal's own templates/scala_test_job.yml runs
      # ScalaAIFuncTests*, ScalaEBMTests and ScalaPredictTests with useConda unset,
      # reserving the env for its PowerBI and nbtest jobs. Those are precisely the three
      # packages this job's Scala lane runs, and that lane already exports
      # CREATE_SEMPY_WRITER=false, which is the non-conda path in Internal's template.
      condition: and(succeeded(), eq(variables['COMPAT_LANE'], 'python'))
    - task: AzureKeyVault@2
      displayName: 'Fetch AI service secrets'
      # Scala lane only. 'Run Internal Scala tests' is the sole consumer -- it maps the
      # four sempy-integration-* values into its env block. Nothing in the Python lane
      # reads them: ADO exposes Key Vault values as secret variables, which are never
      # auto-exported into a script's environment, and the Python steps declare no env
      # block. sbt's own project/Secrets.scala is inert here too (every accessor is
      # behind SYNAPSEML_ENABLE_PUBLISH, unset in this job) and shells out to az
      # directly rather than reading these variables. Fetching them in the Python lane
      # would therefore materialise a certificate and this vault's secrets on an agent
      # that never uses them.
      condition: and(succeeded(), eq(variables['COMPAT_LANE'], 'scala'))
      retryCountOnTaskFailure: 3
      inputs:
        azureSubscription: 'SynapseML Build'
        keyVaultName: mmlspark-keys
    - template: templates/fabric_kv.yml
      parameters:
        condition: and(succeeded(), eq(variables['COMPAT_LANE'], 'scala'))
    - task: AzureCLI@2
      displayName: 'Run Internal Scala tests'
      timeoutInMinutes: 60
      condition: and(succeeded(), eq(variables['COMPAT_LANE'], 'scala'))
      inputs:
        azureSubscription: 'SynapseML Build'
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          set -e
          cd $(Agent.BuildDirectory)/s-internal
          # The conda env is built only in the Python lane (see 'Create Internal conda
          # env'), so activate it only when it is actually present rather than assuming
          # it exists. sbt and the three packages tested below run on the agent's default
          # Python, which is how SynapseML-Internal runs these same suites.
          if conda env list 2>/dev/null | grep -q '^synapseml-internal[[:space:]]'; then
            eval "$(conda shell.bash hook)"
            conda activate synapseml-internal
          fi
          export CREATE_SEMPY_WRITER=false
          export SBT_OPTS="-Xmx4G -Xss2M -Duser.timezone=GMT"
          echo "Running Internal tests against OSS $OSS_VERSION..."
          # Only the reproducible packages run here. They exercise Internal code against
          # the OSS API surface, so a failure is most often a genuine break. They are not
          # hermetic -- spark.aifunc calls live AI services and takes ~23 min -- which is
          # part of why this job is advisory rather than a merge gate.
          #
          # powerbi and nbtest are deliberately NOT run: they drive live services
          # (PowerBI XMLA needs a populated workspace; nbtest submits Spark Job
          # Definitions to live Fabric capacity) and fail here for environmental
          # reasons regardless of the OSS diff. Running them anyway cost ~4 min and
          # produced only ignorable warnings. That live E2E coverage belongs in
          # SynapseML-Internal's own nightly pipeline, which has the workspaces,
          # sample datasets and capacity provisioned.
          FAILURES=0
          for pkg in spark.aifunc ebm predict; do
            echo "=== Testing $pkg ==="
            if ! sbt "testOnly com.microsoft.azure.synapse.ml.$pkg.**"; then
              echo "##vso[task.logissue type=error]$pkg tests failed - OSS change breaks Internal"
              FAILURES=$((FAILURES + 1))
            fi
          done
          if [ $FAILURES -gt 0 ]; then
            echo "##vso[task.logissue type=error]$FAILURES test package(s) failed"
            exit 1
          fi

          # sbt `testOnly` exits 0 when its filter matches nothing, so an Internal package
          # rename would turn this job into a permanently green no-op. The version retarget
          # above is guarded against exactly this class of false green; the tests were not.
          # Count what actually ran instead of trusting the exit status. grep -o emits one
          # match per line, so several <testsuite> elements sharing a line all count.
          TEST_COUNT=$(find . -path '*/test-reports/TEST-*.xml' -exec grep -ho 'tests="[0-9]*"' {} + \
            | tr -dc '0-9\n' | awk '{n += $1} END {print n + 0}')
          echo "Scala tests executed: $TEST_COUNT"
          if [ "${TEST_COUNT:-0}" -lt 150 ]; then
            echo "##vso[task.logissue type=error]Only $TEST_COUNT Scala tests ran (expected ~211); the testOnly filter matched little or nothing, so this result is not a real signal"
            exit 1
          fi
      env:
        INTEGRATION_ENV: $(sempy-integration-region)
        INTEGRATION_ACCOUNT: $(sempy-integration-account)
        INTEGRATION_CERTIFICATE: $(sempy-integration-certificate)
        INTEGRATION_WORKSPACE_PREFIX: $(sempy-integration-workspace-prefix)
    - task: AzureCLI@2
      displayName: 'Package Internal Python against OSS'
      timeoutInMinutes: 15
      inputs:
        azureSubscription: 'SynapseML Build'
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          set -e
          cd $(Agent.BuildDirectory)/s-internal
          eval "$(conda shell.bash hook)"
          conda activate synapseml-internal
          export CREATE_SEMPY_WRITER=false
          export SBT_OPTS="-Xmx4G -Xss2M -Duser.timezone=GMT"
          echo "Packaging Internal Python against OSS $OSS_VERSION..."
          # packagePython and publishM2 share one sbt session so the version is
          # computed once. The retarget step now commits its edits, so dynver no
          # longer appends a wall-clock timestamp and every sbt session in this job
          # agrees; keeping these together is cheap defence in depth.
          sbt packagePython publishM2
          echo "=== published Internal versions in ~/.m2 ==="
          # Glob the Scala suffix so this diagnostic is correct on every branch:
          # master builds _2.12 while the Spark 4 branches build _2.13, and the
          # hardcoded _2.12 printed nothing there - exactly on the branches where a
          # version mismatch most needed to be visible.
          ls -d "$HOME"/.m2/repository/com/microsoft/azure/*-internal_*/*/ 2>/dev/null || true
      # This was succeededOrFailed() so Python still ran when the Scala tests failed
      # earlier in the same job. The lanes are separate jobs now, so that decoupling is
      # structural and the condition returns to plain succeeded(): nothing preceding it
      # in this lane is a test, so a failure here means setup broke and packaging against
      # a broken setup can only produce a second, more confusing error.
      condition: and(succeeded(), eq(variables['COMPAT_LANE'], 'python'))
    # NOTE: 'Run Internal Python tests (AIFunc)' was intentionally removed. All four
    # AIFunc suites call live Azure OpenAI endpoints, so they measure service and
    # quota availability rather than OSS/Internal compatibility. They took ~23 min
    # of the job's budget and were the main reason it hit its timeout before the
    # gating ExcludeAIFunc step could finish. They remain covered by
    # SynapseML-Internal's own pipeline.
    - task: AzureCLI@2
      displayName: 'Run Internal Python compatibility tests'
      timeoutInMinutes: 30
      inputs:
        azureSubscription: 'SynapseML Build'
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          set -e
          cd $(Agent.BuildDirectory)/s-internal
          eval "$(conda shell.bash hook)"
          conda activate synapseml-internal
          export CREATE_SEMPY_WRITER=false
          export SBT_OPTS="-Xmx4G -Xss2M -Duser.timezone=GMT"
          # The fixture script builds several models in-process and then launches a
          # JVM for a Spark session. That launch failed once with JAVA_GATEWAY_EXITED,
          # which pyspark reports without surfacing any JVM stderr, so record the
          # agent state first to make a repeat diagnosable rather than a mystery.
          echo "=== agent state before Spark JVM launch ==="
          free -m || true
          df -h /home/vsts /tmp || true
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version 2>&1 || true
          echo "residual JVMs: $(pgrep -c java || echo 0)"
          echo "==========================================="
          echo "Creating MLflow model fixtures..."
          # Launching the gateway is the one step here that is known to fail
          # intermittently, so give it a second attempt before failing the job.
          if ! python ./src/test/python/make_mlflow_models.py; then
            echo "##vso[task.logissue type=warning]MLflow fixture generation failed; retrying once"
            free -m || true
            sleep 30
            python ./src/test/python/make_mlflow_models.py
          fi
          # Internal's non-live suites create Spark in this process, while its typing
          # suite verifies that importing the pandas-on-Spark facade does not create
          # a Py4J gateway. Running both in one pytest process makes that assertion
          # order-dependent. The common target preserves Internal's default live-test
          # exclusions, runs the non-typing tests first, then validates the installed
          # typing artifacts in a fresh Python process that clears PYTEST_ADDOPTS.
          export PYTEST_ADDOPTS="${PYTEST_ADDOPTS:+$PYTEST_ADDOPTS }--ignore=typing"
          echo "Running non-live and isolated typing tests against OSS $OSS_VERSION..."
          sbt testPythonAIFuncCommon
      condition: and(succeeded(), eq(variables['COMPAT_LANE'], 'python'))
    - task: PublishTestResults@2
      displayName: 'Publish Internal Scala Test Results'
      inputs:
        testResultsFiles: '**/test-reports/TEST-*.xml'
        # Without this the task searches the OSS checkout, which has no Internal
        # results, and silently publishes nothing.
        searchFolder: '$(Agent.BuildDirectory)/s-internal'
        failTaskOnFailedTests: false
      condition: and(succeededOrFailed(), eq(variables['COMPAT_LANE'], 'scala'))
    - task: PublishTestResults@2
      displayName: 'Publish Internal Python Test Results'
      inputs:
        testResultsFiles: '**/python-test-*.xml'
        searchFolder: '$(Agent.BuildDirectory)/s-internal'
        failTaskOnFailedTests: false
      condition: and(succeededOrFailed(), eq(variables['COMPAT_LANE'], 'python'))
