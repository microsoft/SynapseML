resources:
  containers:
  # Prerequisites, both of which fail the build at resource-validation time —
  # before any job starts — so neither surfaces as a normal job failure:
  #   1. A Docker Registry service connection named exactly 'SynapseML MCR',
  #      pointing at mmlsparkmcr.azurecr.io, must exist in the ADO project and
  #      be authorized for this pipeline.
  #   2. The tag below must already be present in the registry. It is content
  #      addressed from .dockerignore + environment.yml + build.sbt + sonatype.sbt +
  #      project/ + tools/docker/ci/Dockerfile, and is built and pushed only by the
  #      BuildCIImage job on master. A change to any of those inputs therefore
  #      needs its image published from master before this pipeline can pull it.
  - container: ci
    image: mmlsparkmcr.azurecr.io/synapseml/ci:ci-3e4e3ef8e44d
    endpoint: 'SynapseML MCR'
  repositories:
  - repository: SynapseML-Internal
    type: git
    name: A365/SynapseML-Internal
    # Queue-time default only. `ref` is resolved before any job runs, so it cannot depend on
    # the branch under test; the InternalCompat job re-points this checkout at the Internal
    # branch matching the OSS target branch. See 'Select matching SynapseML-Internal branch'.
    ref: master

trigger:
  branches:
    include:
    - master
    - spark3.5
    - spark4.0
    - spark4.1
  paths:
    exclude:
    - README.md
    - CONTRIBUTORS.md
    - SECURITY.md
    - "docs/Reference/Contributor Guide.md"
    - "docs/Reference/Developer Setup.md"
    - "docs/Reference/Docker Setup.md"
    - CODEOWNERS

pr:
  branches:
    include:
    - master
    - spark3.5
    - spark4.0
    - spark4.1
  paths:
    exclude:
    - README.md
    - CONTRIBUTORS.md
    - SECURITY.md
    - "docs/Reference/Contributor Guide.md"
    - "docs/Reference/Developer Setup.md"
    - "docs/Reference/Docker Setup.md"
    - CODEOWNERS

schedules:
  - cron: "0 0 * * *"
    displayName: Daily midnight build
    always: true
    branches:
      include:
        - master

parameters:
  - name: testStyle
    displayName: Run Style Tests
    type: boolean
    default: true
  - name: testUnit
    displayName: Run Unit Tests
    type: boolean
    default: true
  - name: testPython
    displayName: Run Python Tests
    type: boolean
    default: true
  - name: testR
    displayName: Run R Tests
    type: boolean
    default: true
  - name: testDatabricksE2E
    displayName: Run Databricks E2E Tests
    type: boolean
    default: true
  - name: testFabricE2E
    displayName: Run Fabric E2E Tests
    type: boolean
    default: true
  - name: testWebsiteSamples
    displayName: Run Website Samples Tests
    type: boolean
    default: true
  - name: publishArtifacts
    displayName: Publish Artifacts
    type: boolean
    default: true
  - name: publishDockerImages
    displayName: Publish Docker Images
    type: boolean
    default: false
  - name: publishRelease
    displayName: Publish Release
    type: boolean
    default: false

variables:
  runTests: True
  CONDA_CACHE_DIR: /usr/share/miniconda/envs
  UBUNTU_VERSION: ubuntu-22.04
  ComponentDetection.Timeout: 900
  CI_IMAGE_TAG: ci-3e4e3ef8e44d
  isMaster: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]
  isTag: $[startsWith(variables['Build.SourceBranch'], 'refs/tags/')]
  isPR: $[eq(variables['Build.Reason'], 'PullRequest')]
  SYNAPSEML_GPU_SMOKE_TESTS: $[eq(variables['Build.Reason'], 'PullRequest')]
  # Run coverage only on PRs, master, or tag builds to speed up feature branch builds
  runCoverage: $[or(eq(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/'))]

jobs:
- job: BuildAndCacheSbt
  displayName: 'Prewarm sbt bootstrap cache'
  cancelTimeoutInMinutes: 0
  pool:
    vmImage: $(UBUNTU_VERSION)
  steps:
    - checkout: self
      fetchDepth: 1
    - bash: |
        set -euo pipefail
        HASH=$({
          sha256sum .dockerignore environment.yml build.sbt sonatype.sbt tools/docker/ci/Dockerfile
          git ls-files -z -- project | sort -z | xargs -0 sha256sum
        } | sha256sum | cut -c1-12)
        EXPECTED_TAG="ci-${HASH}"
        VARIABLE_TAG="$(CI_IMAGE_TAG)"
        RESOURCE_TAG="$(
          python3 - <<'PY'
        from pathlib import Path

        lines = Path("pipeline.yaml").read_text(encoding="utf-8").splitlines()
        in_ci = False
        for line in lines:
            stripped = line.strip()
            if stripped == "- container: ci":
                in_ci = True
                continue
            if in_ci and stripped.startswith("image:"):
                image = stripped.split(":", 1)[1].strip().strip("'\"")
                print(image.rsplit(":", 1)[1])
                break
        else:
            raise SystemExit("Could not find resources.containers ci image tag")
        PY
        )"

        echo "CI image content hash tag: $EXPECTED_TAG"
        echo "CI_IMAGE_TAG variable: $VARIABLE_TAG"
        echo "resources.containers[ci] image tag: $RESOURCE_TAG"

        if [ "$VARIABLE_TAG" != "$EXPECTED_TAG" ]; then
          echo "##vso[task.logissue type=error]CI_IMAGE_TAG ($VARIABLE_TAG) does not match dependency hash ($EXPECTED_TAG). Update the CI image tag with the Dockerfile/dependency change."
          exit 1
        fi

        if [ "$RESOURCE_TAG" != "$EXPECTED_TAG" ]; then
          echo "##vso[task.logissue type=error]resources.containers[ci] image tag ($RESOURCE_TAG) does not match dependency hash ($EXPECTED_TAG). Update resources.containers[ci].image with the same tag."
          exit 1
        fi
      displayName: 'Validate CI image tag'
    - bash: |
        set -uo pipefail
        run_databricks_cpu=true
        run_databricks_gpu=true

        if [ "$(Build.Reason)" = "PullRequest" ]; then
          target_ref="${SYSTEM_PULLREQUEST_TARGETBRANCH:-}"
          if [ -z "$target_ref" ]; then
            echo "##vso[task.logissue type=warning]PR target branch was unavailable; running Databricks E2E"
          elif git fetch --no-tags --depth=1 origin "$target_ref"; then
            target_commit="$(git rev-parse FETCH_HEAD)"

            # Azure checks out the PR merge ref, so target tip -> HEAD is the
            # effective PR diff. A source-only checkout can only over-report
            # target changes, which safely keeps Databricks enabled.
            echo "Changed paths used for Databricks E2E impact detection:"
            changed_paths_file="$(mktemp)"
            trap 'rm -f "$changed_paths_file"' EXIT
            git diff --name-only -z --diff-filter=ACMRD "$target_commit" HEAD > "$changed_paths_file"
            tr '\0' '\n' < "$changed_paths_file" | sed 's/^/  /'

            cpu_decision="$(
              python3 tools/ci/databricks_impact.py --null --suite cpu < "$changed_paths_file"
            )"
            gpu_decision="$(
              python3 tools/ci/databricks_impact.py --null --suite gpu < "$changed_paths_file"
            )"
            case "$cpu_decision" in
              true|false) run_databricks_cpu="$cpu_decision" ;;
              *)
                echo "##vso[task.logissue type=warning]Invalid Databricks CPU impact result; running CPU E2E"
                ;;
            esac
            case "$gpu_decision" in
              true|false) run_databricks_gpu="$gpu_decision" ;;
              *)
                echo "##vso[task.logissue type=warning]Invalid Databricks GPU impact result; running GPU E2E"
                ;;
            esac
          else
            echo "##vso[task.logissue type=warning]Could not fetch PR target branch; running Databricks E2E"
          fi
        else
          echo "Non-PR build; Databricks E2E remains enabled"
        fi

        echo "Databricks CPU E2E enabled: $run_databricks_cpu"
        echo "Databricks GPU E2E enabled: $run_databricks_gpu"
        echo "##vso[task.setvariable variable=runDatabricksCpuE2E;isOutput=true]$run_databricks_cpu"
        echo "##vso[task.setvariable variable=runDatabricksGpuE2E;isOutput=true]$run_databricks_gpu"
      name: detectDatabricksImpact
      displayName: 'Detect Databricks E2E impact'
    - template: templates/update_cli.yml
    - template: templates/sbt_cache.yml
      parameters:
        prewarm: true
        maxAttempts: 7
        maxBackoffSeconds: 180


- job: BuildCIImage
  displayName: 'Build trusted CI image'
  cancelTimeoutInMinutes: 0
  timeoutInMinutes: 60
  pool:
    vmImage: $(UBUNTU_VERSION)
  steps:
    - checkout: self
      fetchDepth: 1
    - bash: |
        set -euo pipefail
        echo "=== Disk space BEFORE cleanup ==="
        df -h / | grep -E 'Filesystem|/$'
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /usr/lib/google-cloud-sdk || true
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /opt/hostedtoolcache || true
        sudo rm -rf /usr/local/share/boost || true
        sudo rm -rf /usr/share/swift || true
        sudo rm -rf /usr/local/.ghcup || true
        sudo rm -rf /usr/share/miniconda || true
        sudo rm -rf /usr/local/share/chromium || true
        sudo docker image prune -af || true
        echo "=== Disk space AFTER cleanup ==="
        df -h / | grep -E 'Filesystem|/$'
      displayName: 'Free disk space'
      condition: and(succeeded(), eq(variables.isMaster, true), ne(variables.isPR, true))
    - task: Docker@2
      displayName: 'Login to ACR'
      condition: and(succeeded(), eq(variables.isMaster, true), ne(variables.isPR, true))
      inputs:
        command: login
        containerRegistry: 'SynapseML MCR'
    - bash: |
        set -euo pipefail
        HASH=$({
          sha256sum .dockerignore environment.yml build.sbt sonatype.sbt tools/docker/ci/Dockerfile
          git ls-files -z -- project | sort -z | xargs -0 sha256sum
        } | sha256sum | cut -c1-12)
        TAG="ci-${HASH}"
        EXPECTED_TAG="$(CI_IMAGE_TAG)"
        LATEST_TAG="ci-latest"
        REGISTRY="mmlsparkmcr.azurecr.io"
        REPO="synapseml/ci"
        echo "Content hash: $TAG"

        if [ "$TAG" != "$EXPECTED_TAG" ]; then
          echo "##vso[task.logissue type=error]CI_IMAGE_TAG ($EXPECTED_TAG) does not match dependency hash ($TAG). Update the pipeline image tag with the Dockerfile/dependency change."
          exit 1
        fi

        IMAGE_EXISTS=false
        for i in 1 2 3; do
          if docker manifest inspect "${REGISTRY}/${REPO}:${TAG}" > /dev/null 2>&1; then
            IMAGE_EXISTS=true
            break
          fi
          [ $i -lt 3 ] && echo "Manifest inspect attempt $i failed, retrying..." && sleep 5
        done

        if [ "$IMAGE_EXISTS" = "true" ]; then
          echo "Image $TAG exists. Re-tagging server-side as $LATEST_TAG."
          docker buildx imagetools create \
            --tag "${REGISTRY}/${REPO}:${LATEST_TAG}" \
            "${REGISTRY}/${REPO}:${TAG}"
        else
          echo "Image $TAG not found. Building from trusted master."
          docker pull "${REGISTRY}/${REPO}:${LATEST_TAG}" || true
          docker build \
            --cache-from "${REGISTRY}/${REPO}:${LATEST_TAG}" \
            -t "${REGISTRY}/${REPO}:${TAG}" \
            -t "${REGISTRY}/${REPO}:${LATEST_TAG}" \
            -f tools/docker/ci/Dockerfile .
          docker push "${REGISTRY}/${REPO}:${TAG}"
          docker push "${REGISTRY}/${REPO}:${LATEST_TAG}"
        fi
      displayName: 'Check/Build CI Image'
      condition: and(succeeded(), eq(variables.isMaster, true), ne(variables.isPR, true))

- job: Style
  dependsOn:
    - BuildAndCacheSbt
    - BuildCIImage
  cancelTimeoutInMinutes: 0
  condition: and(succeeded(), eq(variables.runTests, 'True'), eq('${{ parameters.testStyle }}', true))
  pool:
    vmImage: $(UBUNTU_VERSION)
  container: ci
  steps:
    - template: templates/free_disk.yml
    - template: templates/sbt_cache.yml
    - bash: sbt scalastyle test:scalastyle
      displayName: 'Scala Style Check'
    - bash: |
        set -e
        source activate synapseml
        black --diff --color . && black --check -q .
      displayName: 'Python Style Check'
- ${{ if eq(parameters.publishArtifacts, true) }}:
  - job: Publish
    dependsOn:
      - BuildAndCacheSbt
      - BuildCIImage
    condition: and(succeeded(), eq('${{ parameters.publishArtifacts }}', true))
    cancelTimeoutInMinutes: 0
    pool:
      vmImage: $(UBUNTU_VERSION)
    container: ci
    steps:
      - template: templates/free_disk.yml
      - template: templates/sbt_cache.yml
      - template: templates/kv.yml
      - bash: |
          set -euo pipefail
          PACKAGE_VERSION=$(bash tools/ci/get_sbt_version.sh)
          echo "Publishing SynapseML package version $PACKAGE_VERSION"
          echo "##vso[task.setvariable variable=packageVersion]$PACKAGE_VERSION"
        displayName: 'Resolve package version'
      - task: MavenAuthenticate@0
        name: mavenAuthPublicPackages
        displayName: Authenticate SynapseML_PublicPackages
        inputs:
          artifactsFeeds: SynapseML_PublicPackages
          mavenServiceConnections: SynapseML_PublicPackages-Feed-Connection
      - task: AzureCLI@2
        displayName: 'Publish Artifacts'
        inputs:
          azureSubscription: 'SynapseML Build'
          scriptLocation: inlineScript
          scriptType: bash
          inlineScript: |
            set -e
            test -n "$(packageVersion)"
            echo "Publishing SynapseML package version $(packageVersion)"
            source activate synapseml
            sbt packagePython uploadNotebooks
            sbt -DskipCodegen=true publishBlob publishDocs publishR publishPython
            sbt genBuildInfo
            echo "##vso[task.uploadsummary]$(pwd)/target/Build.md"
            sbt -DskipCodegen=true publishLocalSigned
            python tools/esrp/prepare_jar.py
        env:
          NEXUS-UN: $(nexus-un)
          NEXUS-PW: $(nexus-pw)
          PGP-PRIVATE: $(pgp-private)
          PGP-PUBLIC: $(pgp-public)
          PGP-PW: $(pgp-pw)
          SYNAPSEML_ENABLE_PUBLISH: true
      - task: AzureCLI@2
        inputs:
          azureSubscription: 'SynapseML Build'
          scriptLocation: inlineScript
          scriptType: bash
          inlineScript: |
            set -e
            sbt publishBadges
        condition: and(not(failed()), not(canceled()), eq(variables.isMaster, true))
        displayName: Publish Badges

- job: DatabricksCPUE2E
  dependsOn:
    - BuildAndCacheSbt
    - BuildCIImage
  displayName: 'Databricks CPU E2E'
  condition: >-
    and(
      succeeded(),
      eq(variables.runTests, 'True'),
      eq('${{ parameters.testDatabricksE2E }}', true),
      eq(dependencies.BuildAndCacheSbt.outputs['detectDatabricksImpact.runDatabricksCpuE2E'], 'true')
    )
  timeoutInMinutes: 300
  cancelTimeoutInMinutes: 0
  pool:
    vmImage: $(UBUNTU_VERSION)
  container: ci
  variables:
    MML_ADB_AUTH_TYPE: "aad"
    MML_ADB_WORKSPACE_HOST: "adb-1885762835647850.10.azuredatabricks.net"
    MML_ADB_WORKSPACE_RESOURCE_ID: "/subscriptions/e342c2c0-f844-4b18-9208-52c8c234c30e/resourceGroups/marhamil-mmlspark/providers/Microsoft.Databricks/workspaces/synapseml-build-adb"
  strategy:
    matrix:
      databricks-cpu-1:
        TEST-CLASS: "com.microsoft.azure.synapse.ml.nbtest.DatabricksCPUTests1"
      databricks-cpu-2:
        TEST-CLASS: "com.microsoft.azure.synapse.ml.nbtest.DatabricksCPUTests2"
      databricks-cpu-3:
        TEST-CLASS: "com.microsoft.azure.synapse.ml.nbtest.DatabricksCPUTests3"
      databricks-cpu-4:
        TEST-CLASS: "com.microsoft.azure.synapse.ml.nbtest.DatabricksCPUTests4"
      databricks-cpu-5:
        TEST-CLASS: "com.microsoft.azure.synapse.ml.nbtest.DatabricksCPUTests5"
  steps:
    - template: templates/databricks_e2e_steps.yml

- job: DatabricksGPUE2E
  dependsOn:
    - BuildAndCacheSbt
    - BuildCIImage
  displayName: 'Databricks GPU E2E'
  condition: >-
    and(
      succeeded(),
      eq(variables.runTests, 'True'),
      eq('${{ parameters.testDatabricksE2E }}', true),
      eq(dependencies.BuildAndCacheSbt.outputs['detectDatabricksImpact.runDatabricksGpuE2E'], 'true')
    )
  timeoutInMinutes: 300
  cancelTimeoutInMinutes: 0
  pool:
    vmImage: $(UBUNTU_VERSION)
  container: ci
  variables:
    TEST-CLASS: "com.microsoft.azure.synapse.ml.nbtest.DatabricksGPUTests"
    MML_ADB_AUTH_TYPE: "aad"
    MML_ADB_WORKSPACE_HOST: "adb-1885762835647850.10.azuredatabricks.net"
    MML_ADB_WORKSPACE_RESOURCE_ID: "/subscriptions/e342c2c0-f844-4b18-9208-52c8c234c30e/resourceGroups/marhamil-mmlspark/providers/Microsoft.Databricks/workspaces/synapseml-build-adb"
# The DatabricksRapidsTests suite remains disabled until its existing failures are fixed.
  steps:
    - template: templates/databricks_e2e_steps.yml

- job: FabricE2E
  dependsOn:
    - BuildAndCacheSbt
    - BuildCIImage
  displayName: 'Fabric E2E'
  condition: >-
    and(
      not(failed()),
      not(canceled()),
      eq(variables.runTests, 'True'),
      eq('${{ parameters.testFabricE2E }}', true),
      ne(variables['System.PullRequest.IsFork'], 'True')
    )
  timeoutInMinutes: 120
  cancelTimeoutInMinutes: 5
  pool:
    vmImage: $(UBUNTU_VERSION)
  container: ci
  steps:
    - template: templates/free_disk.yml
    - template: templates/sbt_cache.yml
    - template: templates/kv.yml
      parameters:
        secretsFilter: >
          fabric-test-kv-name,
          fabric-cert-kv-name,
          ado-feed-token,
          nexus-un,
          nexus-pw,
          pgp-private,
          pgp-public,
          pgp-pw
    - template: templates/fabric_kv.yml
    - template: templates/publish.yml
    - task: AzureCLI@2
      displayName: 'E2E'
      inputs:
        azureSubscription:  'SynapseML Build'
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          set -eo pipefail
          artifact_root='$(Build.ArtifactStagingDirectory)/fabric-e2e'
          mkdir -p "$artifact_root"
          printf '%s\n' \
            'authentication=key-vault' \
            'source_version=$(Build.SourceVersion)' \
            'suites=FabricTestCleanup,FabricSmokeTests,FabricNotebookTests' \
            'e2e_step=preparing' \
            > "$artifact_root/run-metadata.txt"

          source activate synapseml
          printf '%s\n' 'e2e_step=running' >> "$artifact_root/run-metadata.txt"
          set +e
          sbt \
            "testOnly com.microsoft.azure.synapse.ml.nbtest.FabricTestCleanup" \
            "testOnly com.microsoft.azure.synapse.ml.nbtest.FabricSmokeTests com.microsoft.azure.synapse.ml.nbtest.FabricNotebookTests"
          sbt_exit_code=$?
          set -e
          printf 'e2e_step=finished\nsbt_exit_code=%s\n' "$sbt_exit_code" \
            >> "$artifact_root/run-metadata.txt"
          exit "$sbt_exit_code"
      env:
        INTEGRATION_ENV: $(sempy-integration-region)
        INTEGRATION_ACCOUNT: $(sempy-integration-account)
        INTEGRATION_CERTIFICATE: $(sempy-integration-certificate)
        INTEGRATION_WORKSPACE_PREFIX: $(sempy-integration-workspace-prefix)
      condition: and(not(failed()), not(canceled()), eq(variables.runTests, 'True'))
    - bash: |
        set -euo pipefail
        artifact_root='$(Build.ArtifactStagingDirectory)/fabric-e2e'
        report_root='$(Build.SourcesDirectory)/core/target/test-reports'
        mkdir -p "$artifact_root/test-reports"
        if [ ! -f "$artifact_root/run-metadata.txt" ]; then
          printf '%s\n' \
            'authentication=key-vault' \
            'source_version=$(Build.SourceVersion)' \
            'e2e_step=not-started' \
            > "$artifact_root/run-metadata.txt"
        fi
        if [ -d "$report_root" ]; then
          find "$report_root" -maxdepth 1 -type f \
            -name 'TEST-com.microsoft.azure.synapse.ml.nbtest.Fabric*.xml' \
            -exec cp '{}' "$artifact_root/test-reports/" \;
        fi
      displayName: 'Collect Fabric E2E evidence'
      condition: always()
    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFiles: '**/test-reports/TEST-*.xml'
        failTaskOnFailedTests: true
      condition: always()
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Fabric E2E evidence'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/fabric-e2e'
        artifact: 'fabric-e2e-$(System.JobAttempt)'
      condition: always()
#
- job: BuildDocker
  dependsOn: BuildAndCacheSbt
  displayName: BuildDocker
  timeoutInMinutes: 120
  pool:
    vmImage: ubuntu-22.04
  steps:
    - template: templates/sbt_cache.yml
    - bash: |
        set -euo pipefail
        VERSION=$(bash tools/ci/get_sbt_version.sh)
        PYTHON_VERSION=$(bash tools/ci/get_python_version.sh)
        echo '##vso[task.setvariable variable=version]'$VERSION
        echo '##vso[task.setvariable variable=pythonVersion]'$PYTHON_VERSION
        echo '##vso[task.setvariable variable=gittag]'$(git tag -l --points-at HEAD)
      displayName: 'Get Docker Tag + Version'
    # Build all images (runs on every build to validate Dockerfiles)
    - task: Docker@2
      displayName: Demo Image Build
      inputs:
        command: build
        repository: mmlspark-demo
        Dockerfile: tools/docker/demo/Dockerfile
        buildContext: $(Build.SourcesDirectory)
        arguments: >-
          --build-arg SYNAPSEML_VERSION=$(version)
          --build-arg PYTHON_VERSION=$(pythonVersion)
        tags: |
          $(version)
        addPipelineData: true
        addBaseImageData: true
      env:
        DOCKER_BUILDKIT: "1"
        BUILDKIT_PROGRESS: plain
    - task: Docker@2
      displayName: Minimal Image Build
      inputs:
        command: build
        repository: mmlspark-minimal
        Dockerfile: tools/docker/minimal/Dockerfile
        buildContext: $(Build.SourcesDirectory)
        arguments: >-
          --build-arg SYNAPSEML_VERSION=$(version)
          --build-arg PYTHON_VERSION=$(pythonVersion)
        tags: |
          $(version)
        addPipelineData: true
        addBaseImageData: true
      env:
        DOCKER_BUILDKIT: "1"
        BUILDKIT_PROGRESS: plain
    # Push demo and minimal when Docker publishing is enabled on master
    - task: AzureCLI@2
      condition: and(eq(variables.isMaster, true), eq('${{ parameters.publishDockerImages }}', true))
      displayName: Push Dev Images to ACR
      inputs:
        azureSubscription: 'SynapseML Build'
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          set -e
          az acr login --name mmlsparkmcr
          docker tag mmlspark-demo:$(version) mmlsparkmcr.azurecr.io/public/mmlspark/build-demo:$(version)
          docker tag mmlspark-minimal:$(version) mmlsparkmcr.azurecr.io/public/mmlspark/build-minimal:$(version)
          docker push mmlsparkmcr.azurecr.io/public/mmlspark/build-demo:$(version)
          docker push mmlsparkmcr.azurecr.io/public/mmlspark/build-minimal:$(version)
    # Push release only on tagged releases
    - task: AzureCLI@2
      condition: and(eq('${{ parameters.publishDockerImages }}', true), eq(variables.isMaster, true), startsWith(variables['gittag'], 'v'))
      displayName: Push Release Image to ACR
      inputs:
        azureSubscription: 'SynapseML Build'
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          set -e
          az acr login --name mmlsparkmcr
          docker tag mmlspark-demo:$(version) mmlsparkmcr.azurecr.io/public/mmlspark/release:$(version)
          docker tag mmlspark-demo:$(version) mmlsparkmcr.azurecr.io/public/mmlspark/release:latest
          docker push mmlsparkmcr.azurecr.io/public/mmlspark/release:$(version)
          docker push mmlsparkmcr.azurecr.io/public/mmlspark/release:latest
    - task: ComponentGovernanceComponentDetection@0

- ${{ if eq(parameters.publishRelease, true) }}:
  - job: Release
    dependsOn: BuildAndCacheSbt
    condition: and(succeeded(), eq('${{ parameters.publishRelease }}', true))
    cancelTimeoutInMinutes: 0
    pool:
      vmImage: $(UBUNTU_VERSION)
    steps:
      - template: templates/sbt_cache.yml
      - template: templates/update_cli.yml
      - bash: |
          echo '##vso[task.setvariable variable=tag]'$(git tag -l --points-at HEAD)
        displayName: 'Get Git Tag'
      - bash: |
          set -euo pipefail
          PACKAGE_VERSION=$(bash tools/ci/get_sbt_version.sh)
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Package version $PACKAGE_VERSION does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi
          echo "Publishing release package version $PACKAGE_VERSION"
          echo "##vso[task.setvariable variable=packageVersion]$PACKAGE_VERSION"
        condition: and(eq(variables.isMaster, true), startsWith(variables['tag'], 'v'))
        displayName: 'Validate release package version'
        env:
          RELEASE_TAG: $(tag)
      - bash: |
          set -e
          wget https://github.com/git-chglog/git-chglog/releases/download/0.8.0/git-chglog_linux_amd64
          chmod +x git-chglog_linux_amd64
          ./git-chglog_linux_amd64 -o CHANGELOG.md $TAG
        condition: and(eq(variables.isMaster, true), startsWith(variables['tag'], 'v'))
      - task: GitHubRelease@1
        condition: and(eq(variables.isMaster, true), startsWith(variables['tag'], 'v'))
        inputs:
          gitHubConnection: 'MMLSpark Github'
          repositoryName: '$(Build.Repository.Name)'
          action: 'create'
          target: '$(Build.SourceVersion)'
          tagSource: 'gitTag'
          releaseNotesFile: 'CHANGELOG.md'
          isDraft: true
      - bash: echo "##vso[task.prependpath]$CONDA/bin"
        condition: and(eq(variables.isMaster, true), startsWith(variables['tag'], 'v'))
        displayName: Add conda to PATH
      - bash: sudo chown -R $(whoami):$(id -ng) $(CONDA_CACHE_DIR)
        displayName: Fix directory permissions
        condition: and(eq(variables.isMaster, true), startsWith(variables['tag'], 'v'))
      - task: Cache@2
        displayName: Use cached Anaconda environment
        condition: and(eq(variables.isMaster, true), startsWith(variables['tag'], 'v'))
        continueOnError: true
        inputs:
          key: 'conda | "$(Agent.OS)" | environment.yml'
          restoreKeys: |
            python | "$(Agent.OS)"
            python
          path: $(CONDA_CACHE_DIR)
          cacheHitVar: CONDA_CACHE_RESTORED
      - bash: |
          set -e
          conda env remove --name synapseml --yes || true
          conda env create --yes -f environment.yml -v
        condition: and(eq(variables.isMaster, true), and(startsWith(variables['tag'], 'v'), ne(variables.CONDA_CACHE_RESTORED, 'true')))
        displayName: Create Anaconda environment
      - task: AzureKeyVault@2
        condition: and(eq(variables.isMaster, true), startsWith(variables['tag'], 'v'))
        inputs:
          azureSubscription: 'SynapseML Build'
          keyVaultName: mmlspark-keys
      - bash: |
          set -e
          source activate synapseml
          echo "Publishing Python package version $(packageVersion)"
          sbt publishPypi
        condition: and(eq(variables.isMaster, true), startsWith(variables['tag'], 'v'))
        env:
          STORAGE-KEY: $(storage-key)
          NEXUS-UN: $(nexus-un)
          NEXUS-PW: $(nexus-pw)
          PGP-PRIVATE: $(pgp-private)
          PGP-PUBLIC: $(pgp-public)
          PGP-PW: $(pgp-pw)
          PYPI-API-TOKEN: $(pypi-api-token)
          SYNAPSEML_ENABLE_PUBLISH: true
        displayName: 'publish python package to pypi'
      - bash: |
          set -e
          source activate synapseml
          echo "Preparing Maven package version $(packageVersion)"
          sbt publishLocalSigned
          python tools/esrp/prepare_jar.py
        condition: and(eq(variables.isMaster, true), startsWith(variables['tag'], 'v'))
        env:
          STORAGE-KEY: $(storage-key)
          NEXUS-UN: $(nexus-un)
          NEXUS-PW: $(nexus-pw)
          PGP-PRIVATE: $(pgp-private)
          PGP-PUBLIC: $(pgp-public)
          PGP-PW: $(pgp-pw)
          SYNAPSEML_ENABLE_PUBLISH: true
        displayName: 'publish jar package to maven central'
      - task: EsrpRelease@9
        inputs:
          connectedservicename: 'SynapseML-ESRP-Service-Connection'
          usemanagedidentity: true
          keyvaultname: 'esrp-kv-ame'
          signcertname: 'esrp-release-mi-cert'
          clientid: '1fc1c0d1-5a85-4081-8f1e-12a8c225b9a6'
          contenttype: maven
          folderlocation: '/home/vsts/.ivy2/local/com.microsoft.azure/'
          owners: 'zhoubo@microsoft.com,marcozo@microsoft.com,romanbat@microsoft.com'
          approvers: 'romanbat@microsoft.com,markus.weimer@microsoft.com,negust@microsoft.com'
          mainpublisher: synapseml
          domaintenantid: '33e01921-4d64-4f8c-a055-5bdaffd5e33d'
        displayName: 'ESRP Publish Package'
        condition: and(eq(variables.isMaster, true), startsWith(variables['tag'], 'v'))

- job: PythonTests
  dependsOn:
    - BuildAndCacheSbt
    - BuildCIImage
  timeoutInMinutes: 120
  cancelTimeoutInMinutes: 0
  condition: and(succeeded(), eq(variables.runTests, 'True'), eq('${{ parameters.testPython }}', true))
  pool:
    vmImage: $(UBUNTU_VERSION)
  container: ci
  strategy:
    matrix:
      core:
        PACKAGE: "core"
      deep-learning-hf:
        PACKAGE: "deepLearning"
        TEST_SUB_PATH: "hf"
        IGNORE_TEST_PATH: ""
      deep-learning-nohf:
        PACKAGE: "deepLearning"
        TEST_SUB_PATH: ""
        IGNORE_TEST_PATH: "hf"
      lightgbm:
        PACKAGE: "lightgbm"
      opencv:
        PACKAGE: "opencv"
      vw:
        PACKAGE: "vw"
      cognitive:
        PACKAGE: "cognitive"
  steps:
    - template: templates/free_disk.yml
    - template: templates/sbt_cache.yml
    - template: templates/kv.yml
    - bash: |
        source activate synapseml
        if [ "$(runCoverage)" = "True" ]; then COV_CMD="coverage"; else COV_CMD=""; fi
        SBT_TASKS=(getDatasets "project core" installPipPackage publishM2)
        if [ "$(PACKAGE)" != "core" ]; then
          SBT_TASKS+=("project $(PACKAGE)" installPipPackage publishM2)
        fi
        sbt $COV_CMD "${SBT_TASKS[@]}"
      displayName: 'Install and package deps'
      timeoutInMinutes: 40
    - task: AzureCLI@2
      displayName: 'Test Python Code'
      retryCountOnTaskFailure: 1
      timeoutInMinutes: 40
      inputs:
        azureSubscription: 'SynapseML Build'
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          set -e
          source activate synapseml
          export SBT_OPTS="-Xmx4G -XX:+UseConcMarkSweepGC -XX:+CMSClassUnloadingEnabled -Xss5M  -Duser.timezone=GMT"
          echo "##vso[task.setvariable variable=SBT_OPTS]$SBT_OPTS"
          echo "SBT_OPTS=$SBT_OPTS"
          IGNORE_TEST_PATH_FLAG=""
          TEST_SUB_PATH_FLAG=""
          if [ -n "$(IGNORE_TEST_PATH)" ]; then
            IGNORE_TEST_PATH_FLAG="-DpythonIgnoreTestPath=$(IGNORE_TEST_PATH)"
          fi
          if [ -n "$(TEST_SUB_PATH)" ]; then
            TEST_SUB_PATH_FLAG="-DpythonSubTestPath=$(TEST_SUB_PATH)"
          fi
          echo "IGNORE_TEST_PATH=$IGNORE_TEST_PATH"
          echo "TEST_SUB_PATH=$TEST_SUB_PATH"
          echo "IGNORE_TEST_PATH_FLAG=$IGNORE_TEST_PATH_FLAG"
          echo "TEST_SUB_PATH_FLAG=$TEST_SUB_PATH_FLAG"
          (sbt $IGNORE_TEST_PATH_FLAG $TEST_SUB_PATH_FLAG "project $(PACKAGE)" coverage testPython) || \
          (sbt $IGNORE_TEST_PATH_FLAG $TEST_SUB_PATH_FLAG "project $(PACKAGE)" coverage testPython) || \
          (sbt $IGNORE_TEST_PATH_FLAG $TEST_SUB_PATH_FLAG "project $(PACKAGE)" coverage testPython)
    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFiles: '**/python-test-*.xml'
        failTaskOnFailedTests: true
      condition: succeededOrFailed()
    - bash: sbt coverageReport
      displayName: 'Generate Codecov report'
      retryCountOnTaskFailure: 1
      condition: and(succeededOrFailed(), eq(variables.runCoverage, true))
    - ${{ if or(eq(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
      - template: templates/codecov.yml
    - template: templates/publish_coverage_ado.yml
