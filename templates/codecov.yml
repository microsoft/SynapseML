parameters:
  - name: notifyOnly
    type: boolean
    default: false
  - name: coverageFlag
    type: string
    default: ''

steps:
  - bash: |
      set -euo pipefail
      temp_dir="${AGENT_TEMPDIRECTORY:-${TMPDIR:-/tmp}}"
      codecov_path="$(mktemp "${temp_dir%/}/codecov.XXXXXX")"
      trap 'rm -f "$codecov_path"' EXIT
      curl --fail --silent --show-error --location --retry 3 \
        --proto '=https' --tlsv1.2 \
        --output "$codecov_path" \
        "https://cli.codecov.io/${CODECOV_VERSION}/linux/codecov"
      printf '%s  %s\n' "$CODECOV_SHA256" "$codecov_path" |
        sha256sum --check --strict
      chmod +x "$codecov_path"
      if [ "${NOTIFY_ONLY,,}" = "true" ]; then
        "$codecov_path" --verbose send-notifications
      else
        test -n "$COVERAGE_FLAG"
        flag="${COVERAGE_FLAG//[^a-zA-Z0-9_]/_}"
        "$codecov_path" --verbose upload-process --dir . --flag "$flag"
      fi
    env:
      CODECOV_TOKEN: $(codecov-token)
      CODECOV_VERSION: v11.3.1
      CODECOV_SHA256: ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d
      NOTIFY_ONLY: ${{ parameters.notifyOnly }}
      COVERAGE_FLAG: ${{ parameters.coverageFlag }}
    retryCountOnTaskFailure: 1
    displayName: Publish Codecov evidence
    condition: succeededOrFailed()
    continueOnError: true
