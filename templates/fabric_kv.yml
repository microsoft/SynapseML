parameters:
  # Applied to every step below. Callers that run these credentials in only some of a
  # job's matrix legs pass a lane-scoped condition so the certificate and vault secrets
  # are materialised only on the agents that actually consume them. The default matches
  # the implicit step condition, so callers that omit it are unaffected.
  - name: condition
    type: string
    default: succeeded()

steps:
  # Fetch Fabric test credentials from Key Vault.
  # Keyvault names are resolved indirectly from mmlspark-keys
  # (loaded by kv.yml): fabric-test-kv-name, fabric-cert-kv-name
  - task: AzureKeyVault@2
    displayName: 'Get Fabric Test Credentials from Key Vault'
    condition: ${{ parameters.condition }}
    inputs:
      azureSubscription: 'SynapseMLFabricTestCreds'
      KeyVaultName: '$(fabric-test-kv-name)'
      SecretsFilter: >
        sempy-integration-region,
        sempy-integration-account,
        sempy-integration-workspace-prefix
      RunAsPreJob: false

  - task: AzureCLI@2
    displayName: 'Get Fabric Test Certificate from Key Vault'
    condition: ${{ parameters.condition }}
    inputs:
      azureSubscription: 'SynapseMLFabricTestCreds'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -euo pipefail

        username="${INTEGRATION_ACCOUNT%%@*}"
        tenant_domain="${INTEGRATION_ACCOUNT#*@}"
        tenant="${tenant_domain%%.*}"
        if [[ "$tenant_domain" == "$INTEGRATION_ACCOUNT" ||
              -z "$username" ||
              -z "$tenant" ||
              "$tenant_domain" == *"@"* ]]; then
          echo "Fabric integration account must use the username@tenant format." >&2
          exit 1
        fi
        certificate_secret_name="${username}-${tenant}"
        certificate_value="$(
          az keyvault secret show \
            --vault-name "$FABRIC_CERT_KEY_VAULT_NAME" \
            --name "$certificate_secret_name" \
            --query value \
            --output tsv \
            --only-show-errors
        )"
        if [ -z "$certificate_value" ]; then
          echo "Fabric integration certificate was empty." >&2
          exit 1
        fi
        printf '##vso[task.setvariable variable=sempy-integration-certificate;issecret=true]%s\n' \
          "$certificate_value"
    env:
      FABRIC_CERT_KEY_VAULT_NAME: $(fabric-cert-kv-name)
      INTEGRATION_ACCOUNT: $(sempy-integration-account)
