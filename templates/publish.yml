steps:
  - task: AzureCLI@2
    displayName: 'Publish Artifacts'
    retryCountOnTaskFailure: 4
    timeoutInMinutes: 30
    inputs:
      azureSubscription: 'SynapseML Build'
      scriptLocation: inlineScript
      scriptType: bash
      inlineScript: |
        set -e
        az account get-access-token --scope https://storage.azure.com/.default --output none
        source activate synapseml
        SBT_SETUP_MAX_STAGGER_SECONDS=0 bash tools/ci/sbt_retry.sh update
        sbt packagePython
        sbt publishBlob
    env:
      ADO-FEED-TOKEN: $(ado-feed-token)
      NEXUS-UN: $(nexus-un)
      NEXUS-PW: $(nexus-pw)
      PGP-PRIVATE: $(pgp-private)
      PGP-PUBLIC: $(pgp-public)
      PGP-PW: $(pgp-pw)
      SYNAPSEML_ENABLE_PUBLISH: true