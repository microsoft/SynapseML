name: Release Prepare — Version Bump PR

# Open a reviewed version/docs bump PR, tag its exact merged commit, then
# dispatch release-tag.yml for derivative tags and Spark release PRs.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New OSS version, three components (e.g. 1.1.4)"
        required: true
        type: string
      skip_docs:
        description: "Skip the versioned-docs snapshot (faster; PR will be incomplete)"
        required: false
        default: false
        type: boolean
  pull_request:
    types: [closed]
    branches: [master]

permissions: {}

jobs:
  prepare:
    name: Bump versions & open release PR
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: write
      contents: write

    steps:
      # A release must be cut from master. Running this from a feature branch
      # would open a PR that bumps versions against unreleased code.
      - name: Validate ref
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/master" ]; then
            echo "::error::Release prepare must run on master, got '$REF'."
            exit 1
          fi

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Public SynapseML version must be exactly X.Y.Z."
            exit 1
          fi

      - name: Check release App configuration
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_APP_CLIENT_ID//[[:space:]]/}" ] || \
             [ -z "${RELEASE_APP_PRIVATE_KEY//[[:space:]]/}" ]; then
            echo "::error::Configure the approved release App: RELEASE_APP_CLIENT_ID repository variable and RELEASE_APP_PRIVATE_KEY repository secret. See scripts/release/README.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # An interrupted release can leave derivative tags without the primary tag.
      - name: Guard against an already-released version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          EXISTING_TAGS=$(git ls-remote --tags origin \
            "refs/tags/v${VERSION}" \
            "refs/tags/v${VERSION}-spark*" \
            "refs/tags/v${VERSION}-python*")
          if [ -n "$EXISTING_TAGS" ]; then
            echo "::error::Release tag family v${VERSION} already exists. Use reviewed recovery instead of new preparation."
            exit 1
          fi
          EXISTING_BRANCH=$(git ls-remote --heads origin "refs/heads/release/prepare-v${VERSION}")
          if [ -n "$EXISTING_BRANCH" ]; then
            echo "::error::Branch release/prepare-v${VERSION} already exists on origin. \
          Finish or recover the existing release PR instead of starting another."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate the full release policy
        env:
          VERSION: ${{ inputs.version }}
          SKIP_SPARK40: ${{ vars.SKIP_SPARK40 == 'true' }}
        run: |
          set -euo pipefail
          python scripts/release/release_guard.py full-release \
            --version "$VERSION" --skip-spark40 "$SKIP_SPARK40" --repo . \
            > "$RUNNER_TEMP/release-draft.json"

      - name: Set up JDK 11
        if: ${{ !inputs.skip_docs }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 11
          cache: sbt

      - name: Install sbt
        if: ${{ !inputs.skip_docs }}
        run: |
          set -euo pipefail
          SBT_VERSION="$(sed -n 's/^sbt.version *= *//p' project/build.properties | tr -d ' ')"
          mkdir -p "$HOME/.local/bin"
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            --output "$HOME/.local/bin/sbt-launch.jar" \
            "https://repo1.maven.org/maven2/org/scala-sbt/sbt-launch/${SBT_VERSION}/sbt-launch-${SBT_VERSION}.jar"
          (
            cd "$HOME/.local/bin"
            sha256sum --check --strict "$GITHUB_WORKSPACE/project/sbt-launch.sha256"
          )
          cat > "$HOME/.local/bin/sbt" <<EOF
          #!/usr/bin/env bash
          exec java -Dsbt.version="${SBT_VERSION}" -jar "$HOME/.local/bin/sbt-launch.jar" "\$@"
          EOF
          chmod +x "$HOME/.local/bin/sbt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Node
        if: ${{ !inputs.skip_docs }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        if: ${{ !inputs.skip_docs }}
        working-directory: website
        run: npm ci

      - name: Bump version strings
        id: bump
        env:
          VERSION: ${{ inputs.version }}
          SKIP_DOCS: ${{ inputs.skip_docs }}
        run: |
          set -euo pipefail
          ARGS=(--to "$VERSION")
          if [ "$SKIP_DOCS" = "true" ]; then
            ARGS+=(--skip-docs)
          fi
          python scripts/bump-version.py "${ARGS[@]}"

      - name: Verify the working tree actually changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::error::bump-version.py reported success but changed nothing. \
          Refusing to open an empty release PR."
            exit 1
          fi
          echo "Files touched: $(git diff --name-only | wc -l)"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Mint after docs generation, but before publishing the prepared branch.
      - name: Create release PR token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Commit and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/prepare-v${VERSION}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: Bump version to v${VERSION}"
          git push origin "$BRANCH"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          VERSION: ${{ inputs.version }}
          SKIP_DOCS: ${{ inputs.skip_docs }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Automated version bump for the **v${VERSION}** release.

          Generated by \`release-prepare.yml\` from \`scripts/bump-version.py\`.

          ### Reviewer checklist
          - [ ] Version strings look right (\`scripts/bump-version.py\` post-condition passed in CI)
          - [ ] Versioned docs snapshot present for ${VERSION}$([ "$SKIP_DOCS" = "true" ] && echo " — **SKIPPED, must be added before merge**")
          - [ ] No unrelated changes

          ### After merge
          1. This workflow tags the merged commit with \`v${VERSION}\` and dispatches \`release-tag.yml\`.
          2. Finish the reviewed Spark 4.1 port PR. The default release covers master and spark4.1, not spark4.0. Bind their merged commits in an OSS-only Maven plan and run \`release_ops.py preflight\`.
          3. Approve that plan ID, use \`release_ops.py resume --apply --approve-plan <id>\`, and complete the required signing approvals.
          4. Publish notes using the original public-only Maven plan, its recorded state, and its fresh producer evidence. Do not regenerate a different plan for existing receipts.

          ### Optional later tracks
          Downstream private integrations are not prerequisites for OSS publication or release notes.
          Keep their configuration, source bindings and deployment procedures outside this public PR.
          See \`scripts/release/README.md\` and the \`synapseml-release\` skill for the complete commands.
          EOF
          )
          gh pr create \
            --title "chore: Bump version to v${VERSION}" \
            --body "$BODY" \
            --base master \
            --head "release/prepare-v${VERSION}"

      # Keep explicit branch validation even when App-created PR events require
      # workflow approval. Azure CI still requires maintainer authorization.
      - name: Queue release PR validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/prepare-v${VERSION}"
          gh workflow run pr-validation.yml --ref "$BRANCH"
          gh workflow run website-deploy.yml --ref "$BRANCH"

  finalize:
    name: Tag merged release PR
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/prepare-v')
    permissions:
      actions: write
      contents: write

    steps:
      - name: Resolve merged release
        id: release
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^release/prepare-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Unexpected release branch '$BRANCH'."
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          if [ "$TITLE" != "chore: Bump version to v${VERSION}" ]; then
            echo "::error::Release PR title does not match branch version v${VERSION}."
            exit 1
          fi
          if [ -z "$MERGED_SHA" ]; then
            echo "::error::pull_request.merge_commit_sha is empty."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify merged version and ancestry
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MERGED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          MASTER_COMMIT=$(git show-ref --hash --verify refs/remotes/origin/master)
          if ! git merge-base --is-ancestor "$MERGED_SHA" "$MASTER_COMMIT"; then
            echo "::error::Merged commit $MERGED_SHA is not contained in origin/master."
            exit 1
          fi
          ACTUAL=$(sed -n 's/^let version = "\([^"]*\)";/\1/p' website/docusaurus.config.js)
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::Merged docusaurus version '$ACTUAL' does not match v${VERSION}."
            exit 1
          fi
          if [ ! -d "website/versioned_docs/version-${VERSION}" ] ||
             [ ! -f "website/versioned_sidebars/version-${VERSION}-sidebars.json" ]; then
            echo "::error::Versioned docs snapshot for ${VERSION} is missing."
            exit 1
          fi
          if ! grep -Fxq "  \"${VERSION}\"," website/versions.json; then
            echo "::error::website/versions.json does not list ${VERSION}."
            exit 1
          fi

      - name: Tag the exact merged commit
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MERGED_SHA: ${{ steps.release.outputs.sha }}
          SKIP_SPARK40: ${{ vars.SKIP_SPARK40 == 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/release/release_guard.py full-release \
            --version "$VERSION" --skip-spark40 "$SKIP_SPARK40" --repo . \
            > "$RUNNER_TEMP/release-draft.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_OBJECT=$(git show-ref --hash --verify "refs/tags/$TAG")
            EXISTING=$(git rev-parse "$TAG_OBJECT^{commit}")
            if [ "$EXISTING" != "$MERGED_SHA" ]; then
              echo "::error::$TAG exists at $EXISTING, expected $MERGED_SHA. Refusing to move it."
              exit 1
            fi
            echo "$TAG already identifies the merged commit."
          else
            git tag "$TAG" "$MERGED_SHA"
            python3 scripts/release/release_guard.py push-tags \
              --repo . --tag "$TAG" --commit "$MERGED_SHA"
          fi
          python3 scripts/release/release_guard.py verify-tag \
            --tag "$TAG" --commit "$MERGED_SHA" --repo . > /dev/null

      # Pushes made with GITHUB_TOKEN do not emit another workflow run. Use the
      # supported workflow_dispatch exception to continue the release chain.
      - name: Dispatch derivative tag orchestration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh workflow run release-tag.yml --ref "v${VERSION}"

      - name: Summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "### Release v${VERSION} tagged" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Derivative tag and Spark branch orchestration was dispatched." >> "$GITHUB_STEP_SUMMARY"
          echo "Next: bind all reviewed source commits in the release plan, then run preflight and approved resume." >> "$GITHUB_STEP_SUMMARY"
