name: Release Tag Orchestrator

# Triggers when a primary version tag (v1.1.2) is pushed to master.
# Creates the python3.11 tag and opens a PR to rebase spark4.0.
#
# Part of the SynapseML Fabric Release Guide (Steps 1.4–1.5).
# See also: release-tag-spark.yml (creates spark/python tags after PR merge).

on:
  push:
    tags:
      # Deliberately permissive: GitHub filter patterns are globs, and support for
      # `+` as a quantifier is inconsistently documented. `[0-9]*` matches under
      # every reading. Strict X.Y.Z enforcement is done by the "Extract version"
      # step below, and derivative tags are excluded by the job-level `if:`.
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  pull-requests: write

jobs:
  release-tags:
    name: Create release tags & rebase PR
    runs-on: ubuntu-latest

    # Skip derivative tags (v1.1.2-spark4.0, v1.1.2-python3.11, etc.)
    if: >-
      !contains(github.ref_name, '-spark') &&
      !contains(github.ref_name, '-python')

    steps:
      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Version '$VERSION' is not X.Y.Z format"
            exit 1
          fi
          echo "📦 Version: $VERSION"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ── Python tag at the released commit ──────────────────
      - name: Create Python 3.11 tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The workflow is triggered by the tag push, so HEAD is already the
          # tagged commit. The python tag must point at that same commit.
          TAG="v${VERSION}-python3.11"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "⚠️ $TAG already exists — skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "✅ Created $TAG"
          fi

      # ── Rebase PRs for the spark release branches ──────────
      - name: Create spark rebase PRs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FAILED=()
          # spark4.1 first: it is the actively published release branch.
          for TARGET in spark4.1 spark4.0; do
            if ! git rev-parse -q --verify "refs/remotes/origin/$TARGET" >/dev/null; then
              echo "⚠️ $TARGET branch doesn't exist — skipping"
              continue
            fi

            BRANCH="release/v${VERSION}-${TARGET}"
            echo "═══ $TARGET ═══"

            git checkout -B "$BRANCH" "origin/$TARGET"

            if ! git rebase origin/master; then
              git rebase --abort
              echo "::error::Rebase of $TARGET onto master conflicted — resolve manually"
              FAILED+=("$TARGET")
              continue
            fi

            git push -f -u origin "$BRANCH"

            # Idempotency: on a re-run the branch already has an open PR, and
            # `gh pr create` errors out for a duplicate head/base. Reuse it.
            EXISTING=$(gh pr list --head "$BRANCH" --base "$TARGET" \
              --state open --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              echo "♻️ PR #$EXISTING already open for $BRANCH — updated by the push above"
              continue
            fi

            gh pr create \
              --base "$TARGET" \
              --head "$BRANCH" \
              --title "chore: Rebase ${TARGET} for v${VERSION} release" \
              --body "## Release v${VERSION} — ${TARGET} rebase

          Auto-generated by the Release Tag Orchestrator.

          ### What this does
          Rebases \`${TARGET}\` onto \`master\` (tagged \`v${VERSION}\`).

          ### After merging
          Tags \`v${VERSION}-${TARGET}\` and the matching python tag will
          be created automatically by the \`release-tag-spark\` workflow.

          ### Next steps
          1. ✅ Merge this PR (use **Rebase and merge**)
          2. Tags are auto-created on merge
          3. Queue ADO pipeline 17563 for \`refs/tags/v${VERSION}\`
          4. Queue ADO pipeline 17563 for \`refs/tags/v${VERSION}-${TARGET}\`
          5. Approve ESRP signing on SAW machine" || {
                echo "::error::Failed to open PR for $TARGET"
                FAILED+=("$TARGET")
              }
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Failed for: ${FAILED[*]}"
            exit 1
          fi

      # ── Summary ────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  Release Tag Orchestrator — Summary"
          echo "═══════════════════════════════════════════════════"
          echo ""
          echo "  Version: v${VERSION}"
          echo ""
          echo "  ✅ v${VERSION}-python3.11 tag created on master"
          echo "  📋 Rebase PRs opened for the existing spark branches"
          echo ""
          echo "  Next: review and merge the spark rebase PR(s)"
          echo "═══════════════════════════════════════════════════"
