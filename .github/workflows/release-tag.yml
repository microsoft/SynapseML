name: Release Tag Orchestrator

# Triggers when a primary version tag (v1.1.2) is pushed to master.
# Creates the python3.11 and spark3.5 tags at the tagged commit, then opens a
# release PR for spark4.1 onto the release commit. Explicit Spark 4.0 inclusion
# processes that port first and chains newly created PRs. Existing PRs are never
# restacked. Recovering Spark 4.0 tags requires include_spark40=true again.
# Reruns recover selected derivative tags at recorded, reviewed port-merge commits.
#
# A full release defaults to master and spark4.1. Spark 4.0 is opt-in.
#
# Part of the SynapseML Fabric Release Guide (Steps 1.4–1.5).
# See also: release-tag-spark.yml (creates spark/python tags after PR merge).

on:
  push:
    tags:
      # Deliberately permissive: GitHub filter patterns are globs, and support for
      # `+` as a quantifier is inconsistently documented. `[0-9]*` matches under
      # every reading. Strict X.Y.Z enforcement is done by the "Extract version"
      # step below, and derivative tags are excluded by the job-level `if:`.
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Explicitly tag approved pre-merge public release candidates'
        type: boolean
        default: false
      bootstrap_apply:
        description: 'Create tags after approval; false only previews and never writes tags'
        type: boolean
        default: false
      bootstrap_plan_json:
        description: 'Generated public OSS-only plan; no private profiles or source bindings'
        type: string
        default: ''
      approve_plan:
        description: 'Exact plan ID independently reviewed and approved by a maintainer'
        type: string
        default: ''
      skip_spark40:
        description: 'Legacy veto; conflicts only with a release selecting Spark 4.0'
        type: boolean
        default: false
      include_spark40:
        description: 'Also release Spark 4.0; bootstrap always follows its approved plan'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-tags-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Inclusion is explicit per dispatch, never inferred from mutable repository
  # variables. Bootstrap uses only its approved plan's target selection.
  INCLUDE_SPARK40: ${{ inputs.include_spark40 == true }}
  SKIP_SPARK40: ${{ inputs.skip_spark40 == true || vars.SKIP_SPARK40 == 'true' }}

jobs:
  bootstrap:
    name: Tag approved pre-merge candidates
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      checks: read
      actions: read
    steps:
      - name: Checkout exact bootstrap source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate and atomically tag approved candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOOTSTRAP_PLAN_JSON: ${{ inputs.bootstrap_plan_json }}
          APPROVE_PLAN: ${{ inputs.approve_plan }}
          BOOTSTRAP_APPLY: ${{ inputs.bootstrap_apply }}
          BOOTSTRAP_POLICY_SKIP_SPARK40: ${{ vars.SKIP_SPARK40 }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$BOOTSTRAP_APPLY" = "true" ]; then
            ARGS+=(--apply --approve-plan "$APPROVE_PLAN")
          elif [ "$BOOTSTRAP_APPLY" != "false" ]; then
            echo "::error::Bootstrap mode must be an explicit boolean."
            exit 1
          fi
          python3 scripts/release/bootstrap_release.py --plan-env \
            "${ARGS[@]}"

  release-tags:
    name: Create release tags & rebase PR
    runs-on: ubuntu-latest

    # Skip derivative tags (v1.1.2-spark4.0, v1.1.2-python3.11, etc.)
    if: >-
      inputs.bootstrap != true &&
      !contains(github.ref_name, '-spark') &&
      !contains(github.ref_name, '-python')

    steps:
      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          # The version comes from the ref this ran on, so a manual run must be
          # dispatched with a release tag selected in the ref picker. Dispatching
          # from master (the default the UI offers) fails here by design rather
          # than guessing which release was meant.
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Version '$VERSION' is not X.Y.Z format. Re-run this workflow with a \
          vX.Y.Z tag selected as the ref."
            exit 1
          fi
          # Published only after validation, so no later step can consume a version
          # this job already rejected.
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate the full release policy before creating tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release/release_guard.py full-release \
            --version "$VERSION" --skip-spark40 "$SKIP_SPARK40" \
            --include-spark40 "$INCLUDE_SPARK40" --repo . \
            > "$RUNNER_TEMP/release-draft.json"

      - name: Capture released commit
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-parse HEAD)
          # The release tag must identify a commit from master. Refuse to mint
          # derivative tags or PRs from an accidental tag on another branch.
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          MASTER_COMMIT=$(git show-ref --hash --verify refs/remotes/origin/master)
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" "$MASTER_COMMIT"; then
            echo "::error::${GITHUB_REF_NAME} points to $RELEASE_COMMIT, which is not contained in origin/master"
            exit 1
          fi
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          echo "✅ ${GITHUB_REF_NAME} points at master commit $RELEASE_COMMIT"

      # ── Tags at the released master commit ────────────────
      - name: Create master release tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Both derivative tags every release carries at the master commit. master
          # targets Spark 3.5 and Python 3.11, and v1.1.1 and v1.1.3 each carry both
          # tags here, so creating only the python one leaves every release short a tag.
          TO_PUSH=()
          for TAG in "v${VERSION}-python3.11" "v${VERSION}-spark3.5"; do
            # Use the immutable tagged commit captured above, not a moving branch ref.
            if git show-ref --verify --quiet "refs/tags/$TAG"; then
              # Same reasoning as release-tag-spark.yml: an existing tag is only
              # benign if it already points at this release. Otherwise the release
              # is mis-tagged and skipping would report success for a bad release.
              TAG_OBJECT=$(git show-ref --hash --verify "refs/tags/$TAG")
              EXISTING=$(git rev-parse "$TAG_OBJECT^{commit}")
              if [ "$EXISTING" != "$RELEASE_COMMIT" ]; then
                echo "::error::$TAG already exists at $EXISTING but v${VERSION} is \
          $RELEASE_COMMIT. Refusing to move a published release tag — resolve manually."
                exit 1
              fi
              echo "⚠️ $TAG already exists at the same commit — skipping"
            else
              git tag "$TAG" "$RELEASE_COMMIT"
              TO_PUSH+=(--tag "$TAG")
              echo "✅ Created $TAG"
            fi
          done
          if [ ${#TO_PUSH[@]} -gt 0 ]; then
            python3 scripts/release/release_guard.py push-tags --repo . "${TO_PUSH[@]}" \
              --commit "$RELEASE_COMMIT"
          fi
          for TAG in "v${VERSION}-python3.11" "v${VERSION}-spark3.5"; do
            python3 scripts/release/release_guard.py verify-tag \
              --tag "$TAG" --commit "$RELEASE_COMMIT" --repo . > /dev/null
          done

      # ── Rebase PRs for the spark release branches ──────────
      - name: Create spark rebase PRs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          case "$INCLUDE_SPARK40" in
            false) TARGETS=(spark4.1) ;;
            true) TARGETS=(spark4.0 spark4.1) ;;
            *) echo "::error::include_spark40 must be true or false"; exit 1 ;;
          esac

          # Each target is rebased onto the previous one's release branch, starting
          # from the master release commit.
          REBASE_ONTO="$RELEASE_COMMIT"

          FAILED=()
          reconcile_target_tags() {
            local TARGET="$1" EXPECTED="$2" TARGET_COMMIT="$3"
            local PYTHON_VER TAG TAG_OBJECT EXISTING
            local -a MISSING_TAGS=() TO_PUSH=()
            case "$TARGET" in
              spark4.0) PYTHON_VER=3.12 ;;
              spark4.1) PYTHON_VER=3.13 ;;
              *) echo "::error::Unknown release target $TARGET"; return 1 ;;
            esac

            # Only a recorded merge authorizes creating missing tags. Legacy
            # releases without that record must already have a consistent pair.
            if [ -z "$EXPECTED" ]; then
              for TAG in "v${VERSION}-${TARGET}" "v${VERSION}-python${PYTHON_VER}"; do
                if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
                  echo "::error::$TAG is missing and no reviewed merge commit is recorded. \
          Recover both tags from an independently verified release commit; do not tag the current branch tip."
                  return 1
                fi
              done
              TAG_OBJECT=$(git show-ref --hash --verify "refs/tags/v${VERSION}-${TARGET}")
              EXPECTED=$(git rev-parse "$TAG_OBJECT^{commit}")
            fi
            if ! git merge-base --is-ancestor "$EXPECTED" "$TARGET_COMMIT"; then
              echo "::error::Release tags for $TARGET identify $EXPECTED, which is no longer on the target branch."
              return 1
            fi

            for TAG in "v${VERSION}-${TARGET}" "v${VERSION}-python${PYTHON_VER}"; do
              if git show-ref --verify --quiet "refs/tags/$TAG"; then
                TAG_OBJECT=$(git show-ref --hash --verify "refs/tags/$TAG")
                EXISTING=$(git rev-parse "$TAG_OBJECT^{commit}")
                if [ "$EXISTING" != "$EXPECTED" ]; then
                  echo "::error::$TAG already exists at $EXISTING but the reviewed release is $EXPECTED. \
          Refusing to move a published release tag."
                  return 1
                fi
              else
                MISSING_TAGS+=("refs/tags/$TAG")
              fi
            done
            for TAG in "${MISSING_TAGS[@]}"; do
              git tag "${TAG#refs/tags/}" "$EXPECTED"
              TO_PUSH+=(--tag "${TAG#refs/tags/}")
            done
            if [ ${#TO_PUSH[@]} -gt 0 ]; then
              python3 scripts/release/release_guard.py push-tags --repo . "${TO_PUSH[@]}" \
                --commit "$EXPECTED"
            fi
            for TAG in "v${VERSION}-${TARGET}" "v${VERSION}-python${PYTHON_VER}"; do
              python3 scripts/release/release_guard.py verify-tag \
                --tag "$TAG" --commit "$EXPECTED" --repo . > /dev/null
            done
          }

          for TARGET in "${TARGETS[@]}"; do
            if ! git show-ref --verify --quiet "refs/remotes/origin/$TARGET"; then
              echo "::error::$TARGET branch is missing; a full release cannot omit it."
              exit 1
            fi
            TARGET_COMMIT=$(git show-ref --hash --verify "refs/remotes/origin/$TARGET")

            BRANCH="release/v${VERSION}-${TARGET}"
            echo "═══ $TARGET (onto $REBASE_ONTO) ═══"

            # Check before rebuilding the branch: an existing PR may contain
            # manual conflict resolution that must not be replaced or made to
            # conflict again locally. Ignore same-named PRs from forks.
            EXISTING=$(gh pr list --head "$BRANCH" --base "$TARGET" \
              --state open --json number,isCrossRepository \
              --jq 'map(select(.isCrossRepository == false))[0].number // empty')
            if [ -n "$EXISTING" ]; then
              echo "♻️ PR #$EXISTING already open for $BRANCH — leaving it untouched."
              echo "   If that PR needs refreshing, update it manually."
              # Chain the next target onto what that PR will land, not onto master.
              git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
              REBASE_ONTO="refs/remotes/origin/$BRANCH"
              continue
            fi

            # "Rebase and merge" rewrites the primary release commit, so
            # an ancestor check cannot recognize a completed release on its
            # own. Reuse a merged PR only while its recorded result remains on
            # the target branch; otherwise fail instead of opening a duplicate.
            MERGED=$(gh pr list --head "$BRANCH" --base "$TARGET" \
              --state merged --json number,mergeCommit,isCrossRepository \
              --jq '(map(select(.isCrossRepository == false))[0] // empty) |
                [.number, .mergeCommit.oid] | @tsv')
            if [ -n "$MERGED" ]; then
              IFS=$'\t' read -r MERGED_PR MERGED_SHA <<< "$MERGED"
              if [ -z "$MERGED_SHA" ]; then
                echo "::error::PR #$MERGED_PR was merged for $BRANCH but has no recorded merge commit"
                FAILED+=("$TARGET")
                break
              fi
              if ! git merge-base --is-ancestor "$MERGED_SHA" "$TARGET_COMMIT"; then
                echo "::error::PR #$MERGED_PR merged at $MERGED_SHA, which is no longer on $TARGET"
                FAILED+=("$TARGET")
                break
              fi
              reconcile_target_tags "$TARGET" "$MERGED_SHA" "$TARGET_COMMIT"
              echo "✅ PR #$MERGED_PR merged at $MERGED_SHA and both remote tags are verified"
              REBASE_ONTO="$TARGET_COMMIT"
              continue
            fi

            # Do not flatten an already-contained release or open an empty PR.
            # Without a recorded merge, verify existing tags rather than guessing
            # which commit on the moving target branch was approved for release.
            if git merge-base --is-ancestor "$REBASE_ONTO" "$TARGET_COMMIT"; then
              reconcile_target_tags "$TARGET" "" "$TARGET_COMMIT"
              echo "✅ $TARGET already contains $REBASE_ONTO and both remote tags are verified"
              REBASE_ONTO="$TARGET_COMMIT"
              continue
            fi

            git checkout -B "$BRANCH" "$TARGET_COMMIT"

            if ! git rebase "$REBASE_ONTO"; then
              git rebase --abort
              echo "::error::Rebase of $TARGET onto $REBASE_ONTO conflicted — resolve manually"
              FAILED+=("$TARGET")
              break
            fi

            git push --force-with-lease -u origin "$BRANCH"
            BASED_ON="$REBASE_ONTO"
            REBASE_ONTO="refs/heads/$BRANCH"
            DISPLAY_BASE="${BASED_ON#refs/heads/}"
            DISPLAY_BASE="${DISPLAY_BASE#refs/remotes/origin/}"

            # Only tell the release engineer to merge something else first when there
            # really is something else. On a re-run where spark4.0 has already
            # landed, this PR is based on a commit that is
            # already on master or on the target branch and can merge on its own.
            case "$BASED_ON" in
              refs/heads/release/v*|refs/remotes/origin/release/v*)
                MERGE_ORDER="The spark branches form a chain: \`spark4.1\` is maintained as
          \`spark4.0\` plus its own upgrade commit. This PR is stacked on
          \`${DISPLAY_BASE}\`, so **merge that PR first**, then re-check this one —
          \"Rebase and merge\" rewrites SHAs on the base branch, so merging this PR
          first would leave it without the spark4.0 release commit."
                ;;
              *)
                MERGE_ORDER="This PR is based on \`${DISPLAY_BASE}\`, which has already
          landed, so there is no other release PR to merge ahead of it."
                ;;
            esac

            # An empty check list means different things on the two branches, and
            # reading "no checks" as "checks passed" is the failure mode worth
            # spending a paragraph on.
            CHECKS="Every supported Spark target is in the repository's validation filters.
          Workflow-created PRs may require \"Approve workflows to run\". A maintainer must
          review execution safety and request Azure validation with \`/azp run\`.
          Confirm an actual current-head build; an empty check list is not a pass."

            gh pr create \
              --base "$TARGET" \
              --head "$BRANCH" \
              --title "chore: Rebase ${TARGET} for v${VERSION} release" \
              --body "## Release v${VERSION} — ${TARGET} rebase

          Auto-generated by the Release Tag Orchestrator.

          ### What this does
          Rebases \`${TARGET}\` onto \`${DISPLAY_BASE}\`.

          ### Merge order
          ${MERGE_ORDER}

          ### Checks
          ${CHECKS}

          ### After merging
          Tags \`v${VERSION}-${TARGET}\` and the matching python tag will
          be created automatically by the \`release-tag-spark\` workflow.

          ### Next steps
          1. ✅ Merge this PR (use **Rebase and merge**)
          2. Tags are auto-created on merge
          3. Bind the merged source commits in the JSON release plan.
          4. Run plan preflight and approved resume through \`release_ops.py\`.
          5. Complete the required signing approvals" || {
                echo "::error::Failed to open PR for $TARGET"
                FAILED+=("$TARGET")
                # Stop the chain, matching the rebase-conflict path above. The next
                # target would be stacked on a pushed branch that has no PR, so it
                # could never be merged in order.
                break
              }
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Failed for: ${FAILED[*]}"
            exit 1
          fi

      # ── Summary ────────────────────────────────────────────
      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  Release Tag Orchestrator — Summary"
          echo "═══════════════════════════════════════════════════"
          echo ""
          echo "  Version: v${VERSION}"
          echo ""
          echo "  ✅ v${VERSION}-python3.11 tag verified at the tagged commit"
          echo "  ✅ v${VERSION}-spark3.5 tag verified at the tagged commit"
          echo "  📋 Spark release branches processed"
          echo ""
          if [ "$INCLUDE_SPARK40" = "true" ]; then
            echo "  Next: review any open spark4.0 release PR before spark4.1."
          else
            echo "  Next: review any open spark4.1 release PR."
          fi
          echo "═══════════════════════════════════════════════════"
