name: Release Notebook Validation

on:
  workflow_dispatch:
  pull_request:
    branches: ["master", "spark3.5", "spark4.0", "spark4.1"]
    paths:
      - "docs/**/*.ipynb"
      - "scripts/release/**"
      - ".github/workflows/release-notebook-validation.yml"

permissions:
  contents: read

jobs:
  notebook-validation:
    name: Check release notebook inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate committed notebooks and archive handling without cloud access
        run: |
          python -m pip install pytest pyyaml
          python -m pytest scripts/release/test_release_dbc.py -q
