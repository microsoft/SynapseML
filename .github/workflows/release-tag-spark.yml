name: Release Tag — Spark Branch Tags

# Triggers when a release rebase PR is merged into spark4.0 or spark4.1.
# Creates the spark and python derivative tags automatically.
#
# Part of the SynapseML Fabric Release Guide (Steps 1.4–1.5).
# See also: release-tag.yml (triggers the rebase PR).

on:
  pull_request:
    types: [closed]
    branches:
      - spark4.0
      - spark4.1

permissions:
  contents: write

jobs:
  create-spark-tags:
    name: Create spark & python tags
    runs-on: ubuntu-latest

    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')

    steps:
      - name: Extract version and target
        id: info
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # Require the exact release branch convention for the target branch.
          if [[ ! "$BRANCH" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)-(spark4\.[01])$ ]]; then
            echo "❌ Release branch '$BRANCH' must match release/vX.Y.Z-spark4.0 or release/vX.Y.Z-spark4.1"
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          BRANCH_TARGET="${BASH_REMATCH[2]}"
          if [ "$BRANCH_TARGET" != "$TARGET" ]; then
            echo "❌ Release branch target '$BRANCH_TARGET' does not match PR base '$TARGET'"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

          # Map branch to python version
          case "$TARGET" in
            spark4.0) echo "python_ver=3.12" >> "$GITHUB_OUTPUT" ;;
            spark4.1) echo "python_ver=3.13" >> "$GITHUB_OUTPUT" ;;
            *) echo "❌ Unknown target: $TARGET"; exit 1 ;;
          esac

          echo "📦 Version: $VERSION, Target: $TARGET"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the merge commit, not the base branch ref. The branch is a
          # moving target: any commit landing on spark4.x between the merge and
          # this job starting would silently get the release tag instead.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          # Full history and tags: the "tag already exists" guard below is
          # meaningless against a shallow clone with no tags fetched.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tags
        env:
          VERSION: ${{ steps.info.outputs.version }}
          TARGET: ${{ steps.info.outputs.target }}
          PYTHON_VER: ${{ steps.info.outputs.python_ver }}
        run: |
          set -euo pipefail

          SPARK_TAG="v${VERSION}-${TARGET}"
          PYTHON_TAG="v${VERSION}-python${PYTHON_VER}"

          TO_PUSH=()
          for TAG in "$SPARK_TAG" "$PYTHON_TAG"; do
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "⚠️ $TAG already exists — skipping"
            else
              git tag "$TAG"
              TO_PUSH+=("$TAG")
              echo "🏷️ Created $TAG"
            fi
          done

          if [ ${#TO_PUSH[@]} -eq 0 ]; then
            echo "✅ Nothing to push — both tags already exist"
          else
            git push origin "${TO_PUSH[@]}"
            echo "✅ Pushed: ${TO_PUSH[*]}"
          fi

      - name: Cleanup release branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git push origin --delete "$HEAD_REF"; then
            echo "🧹 Deleted $HEAD_REF"
          else
            echo "::warning::Could not delete release branch $HEAD_REF — delete it manually"
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.info.outputs.version }}
          TARGET: ${{ steps.info.outputs.target }}
          PYTHON_VER: ${{ steps.info.outputs.python_ver }}
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  Spark Branch Tags — Summary"
          echo "═══════════════════════════════════════════════════"
          echo ""
          echo "  ✅ v${VERSION}-${TARGET} tag created"
          echo "  ✅ v${VERSION}-python${PYTHON_VER} tag created"
          echo "  🧹 Release branch cleaned up"
          echo ""
          echo "  Next steps:"
          echo "    1. Queue ADO pipeline 17563 for refs/tags/v${VERSION}-${TARGET}"
          echo "    2. Approve ESRP signing on SAW machine"
          echo "    3. Proceed to Step 2 (SynapseML-Internal)"
          echo ""
          echo "  Pipeline: https://msdata.visualstudio.com/A365/_build?definitionId=17563"
          echo "═══════════════════════════════════════════════════"
