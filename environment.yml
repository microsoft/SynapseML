name: synapseml
channels:
  - conda-forge
  - default
dependencies:
  - python=3.13
  # SynapseML-Internal uses 2.32.3; LangChain Community requires 2.32.5+.
  - requests=2.32.5
  - pip=25.2
  - r-base=4.4
  - r-sparklyr=1.9.3
  - r-devtools=2.4.5
  - cmake<=3.27
  - openjdk=17
  - pip:
    # PyArrow 18.0.0 provides wheels for Python 3.13 and satisfies mlflow 2.x constraint (pyarrow<19).
    - pyarrow==18.0.0
    - pyspark==4.1.1
    - pandas==2.3.3
    - wheel
    - sphinx==7.4.7
    - sphinx_paramlinks==0.6.0
    - sphinx_rtd_theme
    - coverage
    - pytest
    - pytest-cov
    - nbconvert
    - nbformat
    - pyyaml
    - PyGithub
    - tqdm
    - ipython
    - pytest-codeblocks
    - azure-storage-blob==12.19.1
    - jupyter==1.1.0
    - twine
    - mlflow==2.21.3
    - protobuf>=4.25
    - numpy
    # For Python 3.13, use PyTorch 2.6+ which has Python 3.13 wheels.
    - torch==2.9.1
    - torchvision==0.24.1
    # horovod package was deprecated in 2023, this commit has horovod compile with c++17
    # Ref: https://github.com/horovod/horovod/issues/3996#issuecomment-2098507345
    # Pre-built wheel for faster CI (built from commit 3a31d93 on Python 3.13)
    - https://mmlspark.blob.core.windows.net/installers/horovod-0.28.1-cp313-cp313-linux_x86_64.whl
    - petastorm>=0.11.0
    - pytorch_lightning==2.4.0
    - onnxmltools==1.12.0
    - matplotlib
    - Pillow
    - transformers==4.49.0
    - huggingface-hub==0.26.0
    - langchain==1.3.14
    - langchain-classic==1.0.8
    - langchain-community==0.4.2
    - langchain-openai==1.4.0
    - openai==2.47.0
    - black==22.3.0
    - black[jupyter]==22.3.0
    - mistletoe
    - markdownify
    - pypandoc
    - traitlets
    - opencv-python
    - sentence_transformers~=4.0.2
