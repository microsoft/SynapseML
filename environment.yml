name: synapseml
channels:
  - conda-forge
  - default
dependencies:
  - python=3.14
  - requests=2.26.0
  - pip=25.2
  - r-base=4.4
  - r-sparklyr=1.9.3
  - r-devtools=2.4.5
  - cmake<=3.27
  - openjdk=17
  - pip:
    # PyArrow 22.0.0 is the first release with cp314 (Python 3.14) wheels.
    - pyarrow==22.0.0
    - pyspark==4.1.1
    - pandas==2.3.3
    - wheel
    - sphinx==7.4.7
    - sphinx_paramlinks==0.6.0
    - sphinx_rtd_theme
    - coverage
    - pytest
    - pytest-cov
    - nbconvert
    - nbformat
    - pyyaml
    - PyGithub
    - tqdm
    - ipython
    - pytest-codeblocks
    - azure-storage-blob
    - jupyter
    - twine
    # mlflow 3.6.0 is the first release whose pyarrow constraint (<23) admits
    # pyarrow 22 required for Python 3.14. NOTE: this is a 2.x -> 3.x major bump.
    - mlflow==3.6.0
    - protobuf>=4.25
    - numpy
    # PyTorch 2.9.1 provides cp314 (Python 3.14) linux wheels.
    - torch==2.9.1
    - torchvision==0.24.1
    # horovod package was deprecated in 2023, this commit has horovod compile with c++17
    # Ref: https://github.com/horovod/horovod/issues/3996#issuecomment-2098507345
    # TODO(py3.14): No cp314 horovod wheel exists yet; the cp313 pre-built wheel
    # below cannot install on Python 3.14. Needs a rebuilt cp314 wheel. Horovod
    # is deprecated and horovod-dependent tests are expected to skip gracefully.
    # - https://mmlspark.blob.core.windows.net/installers/horovod-0.28.1-cp313-cp313-linux_x86_64.whl
    - petastorm>=0.11.0
    - pytorch_lightning==2.4.0
    - onnxmltools==1.12.0
    - matplotlib
    - Pillow
    - transformers==4.49.0
    - huggingface-hub==0.26.0
    - langchain==0.3.0
    - langchain-community==0.3.0
    - langchain-openai==0.3.0
    - openai>=1.58.1
    - black==22.3.0
    - black[jupyter]==22.3.0
    - mistletoe
    - markdownify
    - pypandoc
    - traitlets
    - opencv-python
    - sentence_transformers~=4.0.2
