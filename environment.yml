name: synapseml
channels:
  - conda-forge
  - default
dependencies:
  - python=3.13
  # SynapseML-Internal uses 2.32.3; LangChain Community requires 2.32.5+.
  - requests=2.32.5
  - pip=25.2
  - r-base=4.4
  # 1.9.5 restores compatibility with dbplyr 2.6 while retaining Spark 4.1 support.
  - r-sparklyr=1.9.5
  - r-devtools=2.4.5
  - cmake<=3.27
  - openjdk=17
  - pip:
    # PyArrow 18.0.0 provides wheels for Python 3.13 and satisfies mlflow 2.x constraint (pyarrow<19).
    - pyarrow==18.0.0
    - pyspark==4.1.1
    - pandas==2.3.3
    - wheel
    - sphinx==7.4.7
    - sphinx_paramlinks==0.6.0
    - sphinx_rtd_theme
    - coverage
    - pytest
    - pytest-cov
    - nbconvert
    - nbformat
    - pyyaml
    - PyGithub
    - tqdm
    - ipython
    - pytest-codeblocks
    - azure-storage-blob==12.19.1
    - jupyter==1.1.0
    - twine
    - mlflow==2.21.3
    - protobuf>=4.25
    - numpy
    # CPU-only wheels avoid unused CUDA downloads in local/CI; DBR GPU notebooks use runtime-provided CUDA.
    - "https://download.pytorch.org/whl/cpu/torch-2.9.1%2Bcpu-cp313-cp313-manylinux_2_28_x86_64.whl#sha256=39b3dff6d8fba240ae0d1bede4ca11c2531ae3b47329206512d99e17907ff74b"
    - "https://download.pytorch.org/whl/cpu/torchvision-0.24.1%2Bcpu-cp313-cp313-manylinux_2_28_x86_64.whl#sha256=19eb1744686a992522bf9ab8bf4b3245c2202e93a39b1fe1fcb2b8d2ca982048"
    # Horovod v0.28.1 with upstream GCC, C++17, and Python 3.13 fixes; includes PyTorch and Gloo.
    - "https://mmlsparkbuildsynapse.blob.core.windows.net/synapse-extension/horovod/0.28.1/horovod-0.28.1-1-cp313-cp313-linux_x86_64.whl#sha256=7f0aac69b6f961b37357e53a4a983b3a4d921c77cbcbff05854f4201e0b38d53"
    - petastorm>=0.11.0
    - pytorch_lightning==2.4.0
    - onnxmltools==1.12.0
    - matplotlib
    - Pillow
    - transformers==4.49.0
    - huggingface-hub==0.26.0
    - langchain==1.3.14
    - langchain-classic==1.0.8
    - langchain-community==0.4.2
    - langchain-openai==1.4.0
    - openai==2.47.0
    - black==22.3.0
    - black[jupyter]==22.3.0
    - mistletoe
    - markdownify
    - pypandoc
    - traitlets
    - opencv-python
    - sentence_transformers~=4.0.2
